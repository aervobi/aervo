<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aervo - Login</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <script src="/assets/js/ui.js"></script>
  </head>
  <body>
    <div class="auth-msg alert" id="authMsg" role="status" hidden></div>
    <header class="auth-header">
      <a href="/" class="auth-brand" aria-label="Aervo home">
        <img src="/assets/images/logo.png" alt="Aervo" />
      </a>
      <nav class="auth-links">
        <a href="/#services">Product</a>
        <a href="/pricing">Pricing</a>
      </nav>
      <div></div>
    </header>

    <main class="auth-main">
      <div class="card card-hero auth-card">
        <h1>Sign in</h1>
        <p class="auth-lead">Use your Aervo login to access the dashboard.</p>

        <!-- Shown when user arrives after clicking verification email -->
        <div class="alert alert-success auth-notice" id="verifiedBanner" hidden>
          <div class="auth-notice-icon">&#10003;</div>
          <div>
            <strong>Email verified!</strong><br />
            Your account is confirmed. Please log in below.
          </div>
        </div>

        <button
          type="button"
          class="btn btn-secondary btn-block btn-form auth-provider"
          onclick="signInWithGoogle()"
        >
          <img
            src="https://www.google.com/favicon.ico"
            width="18"
            height="18"
            alt=""
          />
          Continue with Google
        </button>

        <button
          type="button"
          class="btn btn-secondary btn-block btn-form auth-provider"
          onclick="signInWithShopify()"
        >
          <span aria-hidden="true">🛍️</span>
          Continue with Shopify
        </button>

        <!-- Shopify store input (hidden by default) -->
        <div id="shopify-input-area" class="form-group" hidden>
          <label class="field-label" for="shopify-store">Your store URL</label>
          <div style="display: flex; gap: var(--space-2); align-items: center">
            <input id="shopify-store" type="text" placeholder="yourstore" />
            <span class="field-help" style="white-space: nowrap; margin: 0"
              >.myshopify.com</span
            >
          </div>
          <button
            type="button"
            class="btn btn-primary btn-block btn-form mt-3"
            onclick="goToShopify()"
          >
            Connect Store
          </button>
        </div>

        <div class="auth-divider"><span>or sign in with email</span></div>

        <form id="login-form">
          <div class="form-group">
            <label class="field-label" for="email">Email</label>
            <input
              id="email"
              type="email"
              placeholder="you@business.com"
              required
            />
          </div>
          <div class="form-group">
            <label class="field-label" for="password">Password</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="auth-row">
            <a href="/forgot-password">Forgot your password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-form">
            Login
          </button>
          <div class="form-error" id="error" role="alert"></div>
          <div class="auth-helper">
            Don't have an account?
            <a href="/onboarding" class="link">Sign up free</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      const BACKEND_URL = "https://api.aervoapp.com";

      // Show verified banner if coming from email verification link
      if (new URLSearchParams(window.location.search).get("verified") === "1") {
        document.getElementById("verifiedBanner").hidden = false;
      }

      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("login-form");
        const emailEl = document.getElementById("email");
        const passwordEl = document.getElementById("password");
        const errorEl = document.getElementById("error");
        const submitBtn = form.querySelector('button[type="submit"]');
        const banner = document.getElementById("authMsg");
        let isSubmitting = false;
        let authMsgTimer = null;

        function showAuthMsg(type, text, hint) {
          if (!banner) return;
          if (authMsgTimer) {
            clearTimeout(authMsgTimer);
            authMsgTimer = null;
          }
          banner.className =
            "auth-msg alert " +
            (type === "error" ? "alert-error" : "alert-info");
          banner.innerHTML =
            "<div class='auth-msg-title'>" +
            text +
            "</div>" +
            (hint ? "<div class='auth-msg-hint'>" + hint + "</div>" : "");
          banner.hidden = false;
          authMsgTimer = setTimeout(
            () => {
              banner.hidden = true;
            },
            type === "error" ? 9000 : 3500,
          );
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (isSubmitting) return;
          isSubmitting = true;
          submitBtn.disabled = true;
          errorEl.textContent = "";
          banner.hidden = true;

          try {
            const response = await fetch(BACKEND_URL + "/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: emailEl.value,
                password: passwordEl.value,
              }),
            });

            const data = await response.json().catch(() => ({}));

            if (response.status === 429) {
              showAuthMsg(
                "error",
                data.message || "Too many attempts.",
                data.hint || "Wait a moment and try again.",
              );
              return;
            }

            if (!response.ok || !data.success) {
              const msg = data.message || "Invalid email or password.";
              showAuthMsg("error", msg);
              errorEl.textContent = msg;
              return;
            }

            // Success — save token and route based on platform
            localStorage.setItem("aervo_token", data.token);
            localStorage.setItem("aervo_user", JSON.stringify(data.user));
            showAuthMsg("success", "Welcome back! Redirecting...");

            setTimeout(async () => {
              try {
                const meRes = await fetch(BACKEND_URL + "/api/user/me", {
                  headers: { Authorization: "Bearer " + data.token },
                });
                const meData = await meRes.json();
                const platform = meData.user && meData.user.platform;
                const onboarded = meData.user && meData.user.onboarded;

                if (!onboarded) {
                  window.location.href = "/onboarding";
                } else if (platform === "csv" || platform === "ims") {
                  // Manual Inventory Management System users
                  window.location.href = "/dashboard/ims";
                } else {
                  window.location.href = "/dashboard";
                }
              } catch (err) {
                window.location.href = "/dashboard"; // was /dashboard/shopify
              }
            }, 600);
          } catch (err) {
            console.error(err);
            showAuthMsg("error", "Network error. Please try again.");
            errorEl.textContent = "Network error. Please try again.";
          } finally {
            isSubmitting = false;
            submitBtn.disabled = false;
          }
        });
      });

      async function signInWithGoogle() {
        try {
          const res = await fetch("https://api.aervoapp.com/auth/google");
          const data = await res.json();
          window.location.href = data.url;
        } catch (err) {
          console.error("Google sign in error:", err);
        }
      }
      function signInWithShopify() {
        const area = document.getElementById("shopify-input-area");
        area.hidden = !area.hidden;
      }

      function goToShopify() {
        const store = document
          .getElementById("shopify-store")
          .value.trim()
          .replace(".myshopify.com", "");
        if (!store) {
          showToast("Please enter your store name");
          return;
        }
        window.location.href =
          "https://api.aervoapp.com/auth/shopify?shop=" +
          store +
          ".myshopify.com";
      }
    </script>
  </body>
</html>
