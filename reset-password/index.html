<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password – Aervo</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <header class="auth-header">
      <a href="/" class="auth-brand" aria-label="Aervo home">
        <img src="/assets/images/logo.png" alt="Aervo" />
      </a>
    </header>

    <main class="auth-main">
      <div class="card card-hero auth-card">
        <h1>Set a new password</h1>
        <p class="auth-lead">
          Enter a new password for your Aervo account. This link will only work
          once.
        </p>

        <form id="reset-form">
          <div class="form-group">
            <label class="field-label" for="password">New password</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••••"
              required
            />
          </div>

          <div class="form-group">
            <label class="field-label" for="confirm">Confirm password</label>
            <input
              id="confirm"
              type="password"
              placeholder="Repeat password"
              required
            />
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="btn btn-primary btn-block btn-form"
          >
            Update password
          </button>

          <div class="form-message error" id="error"></div>
          <div class="form-message success" id="success"></div>

          <div class="auth-helper">
            <a href="/login" class="link">Back to login</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      // ===== 1) Grab token from URL =====
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const form = document.getElementById("reset-form");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm");
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const submitBtn = document.getElementById("submit-btn");

      // If there's no token in the URL, block the form
      if (!token) {
        form.hidden = true;
        const msg = document.createElement("div");
        msg.className = "alert alert-error";
        msg.textContent =
          "Invalid or expired reset link. Please request a new one.";
        document.querySelector(".auth-card").appendChild(msg);
      }

      // ===== 2) Handle form submit =====
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.textContent = "";
        successEl.textContent = "";

        const password = passwordInput.value.trim();
        const confirm = confirmInput.value.trim();

        if (password.length < 8) {
          errorEl.textContent = "Password should be at least 8 characters.";
          return;
        }

        if (password !== confirm) {
          errorEl.textContent = "Passwords do not match.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating...";

        try {
          const response = await fetch(
            "https://api.aervoapp.com/api/reset-password",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, newPassword: password }),
            },
          );

          const data = await response.json();

          if (!response.ok || !data.success) {
            errorEl.textContent =
              data.message ||
              "Something went wrong. Please request a new link.";
          } else {
            successEl.textContent = "Password updated. You can now log in.";
            // Optional: redirect after a few seconds
            setTimeout(() => {
              window.location.href = "/login";
            }, 2500);
          }
        } catch (err) {
          console.error(err);
          errorEl.textContent = "Network error. Please try again.";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Update password";
        }
      });
    </script>
  </body>
</html>
