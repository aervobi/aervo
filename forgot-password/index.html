<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aervo – Forgot password</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />

    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <header class="auth-header">
      <a href="/" class="auth-brand" aria-label="Aervo home">
        <img src="/assets/images/logo.png" alt="Aervo" />
      </a>
    </header>

    <main class="auth-main">
      <div class="card card-hero auth-card">
        <h1>Forgot password</h1>
        <p class="auth-lead">
          Enter the email you use for Aervo and we’ll send you a reset link.
        </p>

        <form id="forgot-form">
          <div class="form-group">
            <label class="field-label" for="email">Email</label>
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-form">
            Send reset link
          </button>

          <div id="msg" class="form-message"></div>

          <div class="auth-helper">
            <a href="/login" class="link">Back to login</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      const BACKEND_URL = "https://api.aervoapp.com";

      const form = document.getElementById("forgot-form");
      const msgEl = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msgEl.textContent = "";
        msgEl.className = "form-message";

        const email = document.getElementById("email").value.trim();

        if (!email) {
          msgEl.textContent = "Please enter your email.";
          msgEl.classList.add("error");
          return;
        }

        try {
          const res = await fetch(`${BACKEND_URL}/api/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await res.json();

          // We always show a generic success message (for security)
          msgEl.textContent =
            data.message || "If an account exists, we sent a reset link.";
          msgEl.classList.add("success");
        } catch (err) {
          console.error(err);
          msgEl.textContent = "Something went wrong. Please try again.";
          msgEl.classList.add("error");
        }
      });
    </script>
  </body>
</html>
