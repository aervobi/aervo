<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/session.js"></script>
    <title>Integrations – Aervo</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <script src="/assets/js/ui.js"></script>
    <style>
      /* Platform accent for this page */
      :root {
        --accent: #60a5fa;
        --accent-rgb: 96, 165, 250;
        --logo-tile: #ffffff; /* brand marks sit on white, as their guidelines prefer */
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
      }

      .container {
        padding: calc(var(--nav-h) + var(--space-7)) var(--space-7) var(--space-9);
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--space-5);
        flex-wrap: wrap;
        margin-bottom: var(--space-8);
      }
      .page-head h1 {
        font-size: var(--fs-32);
        line-height: var(--lh-tight);
      }
      .page-head p {
        margin-top: var(--space-2);
        font-size: var(--fs-16);
        color: var(--text-secondary);
        max-width: 620px;
      }
      .head-summary {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: var(--fs-13);
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .head-summary strong {
        color: var(--text);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        flex: none;
      }
      .dot.on {
        background: var(--success);
        box-shadow: 0 0 0 3px rgba(var(--success-rgb), 0.18);
      }
      .dot.warn {
        background: var(--warning);
        box-shadow: 0 0 0 3px rgba(var(--warning-rgb), 0.18);
      }

      .section {
        margin-bottom: var(--space-8);
      }
      .section-title {
        font-size: var(--fs-13);
        font-weight: var(--fw-semibold);
        text-transform: uppercase;
        letter-spacing: var(--ls-label);
        color: var(--text-secondary);
        margin-bottom: var(--space-4);
      }

      .integrations-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: var(--space-5);
      }

      /* ── Card ── */
      .int-card {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
        padding: var(--space-6);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--surface);
        transition: border-color var(--dur), transform var(--dur), background var(--dur);
      }
      .int-card:hover {
        border-color: var(--border-strong);
        background: var(--surface-raised);
      }
      .int-card.connected {
        border-color: rgba(var(--success-rgb), 0.35);
      }
      .int-card.attention {
        border-color: rgba(var(--warning-rgb), 0.45);
      }

      .int-top {
        display: flex;
        align-items: center;
        gap: var(--space-4);
      }
      .int-logo {
        width: 52px;
        height: 52px;
        flex: none;
        border-radius: var(--radius-md);
        background: var(--logo-tile);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
      }
      .int-logo img {
        width: 30px;
        height: 30px;
        display: block;
      }
      .int-logo.fallback {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        box-shadow: none;
        font-size: var(--fs-20);
        font-weight: var(--fw-bold);
        color: var(--text);
      }
      .int-title {
        flex: 1;
        min-width: 0;
      }
      .int-name {
        font-size: var(--fs-18);
        font-weight: var(--fw-semibold);
        line-height: var(--lh-tight);
      }
      .int-cat {
        font-size: var(--fs-12);
        color: var(--text-muted);
        margin-top: var(--space-1);
      }
      .int-pill {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--fs-12);
        font-weight: var(--fw-semibold);
        white-space: nowrap;
        color: var(--success-text);
      }
      .int-pill.warn {
        color: var(--warning-text);
      }

      .int-desc {
        font-size: var(--fs-14);
        color: var(--text-secondary);
        line-height: var(--lh-normal);
      }

      .int-features {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      .int-features li {
        font-size: var(--fs-12);
        color: var(--text-secondary);
        padding: var(--space-1) var(--space-3);
        border-radius: var(--radius-pill);
        background: var(--surface-raised);
        border: 1px solid var(--border-soft);
      }

      .int-body {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .int-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-soft);
      }
      .int-row-main {
        min-width: 0;
      }
      .int-row-title {
        font-size: var(--fs-14);
        font-weight: var(--fw-semibold);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .int-row-sub {
        font-size: var(--fs-12);
        color: var(--text-muted);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .int-row-sub.error {
        color: var(--warning-text);
        white-space: normal;
      }
      .int-row-actions {
        display: flex;
        gap: var(--space-2);
        flex: none;
      }

      .int-actions {
        display: flex;
        gap: var(--space-2);
        margin-top: auto;
        padding-top: var(--space-2);
      }
      .int-actions .btn {
        flex: 1;
      }

      .trust-note {
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
        padding: var(--space-4) var(--space-5);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-soft);
        background: var(--surface);
        color: var(--text-secondary);
        font-size: var(--fs-13);
        line-height: var(--lh-normal);
      }

      .empty-state p {
        color: var(--text-muted);
        font-size: var(--fs-16);
      }

      @media (max-width: 768px) {
        .container {
          padding: calc(var(--nav-h) + var(--space-5)) var(--space-4) var(--space-7);
        }
        .page-head h1 {
          font-size: var(--fs-24);
        }
        .integrations-grid {
          grid-template-columns: 1fr;
          gap: var(--space-4);
        }
        .int-card {
          padding: var(--space-5);
        }
        .int-row {
          flex-direction: column;
          align-items: stretch;
        }
        .int-row-actions .btn {
          flex: 1;
        }
      }
    </style>
      <link rel="stylesheet" href="/assets/css/app-nav.css" />
  </head>
  <body>
    <script src="/assets/js/app-nav.js" data-active="integrations"></script>

    <main class="container">
      <div class="page-head">
        <div>
          <h1>Integrations</h1>
          <p>
            Connect the tools you run your business on. Aervo only reads your
            data to build insights; it never changes anything in them.
          </p>
        </div>
        <div class="head-summary" id="headSummary" hidden></div>
      </div>

      <div id="content">
        <div class="loading">
          <div class="spinner"></div>
          <div class="loading-text">Loading integrations...</div>
        </div>
      </div>
    </main>

    <script>
      const BACKEND_URL = "https://api.aervoapp.com";
      const token = localStorage.getItem("aervo_token");

      if (!token) window.location.href = "/login";

      let availableIntegrations = [];
      let connectedStores = [];
      let quickbooksStatus = { connected: false };
      let squareStatus = { connected: false };

      // Logos, categories and highlights live here (the server only lists
      // which integrations exist), so every card looks consistent.
      const CATALOG = {
        shopify: {
          name: "Shopify",
          logo: "/assets/images/integrations/shopify.svg",
          category: "E-commerce",
          desc: "Sync your online store's orders, products and customers.",
          features: ["Orders & revenue", "Products & inventory", "Customers"],
          order: 1,
        },
        square: {
          name: "Square",
          logo: "/assets/images/integrations/square.svg",
          category: "Point of sale",
          desc: "Bring in-store sales, items, customers and appointments into Aervo.",
          features: ["Sales by hour & location", "Items & inventory", "Customers & bookings"],
          order: 0,
        },
        quickbooks: {
          name: "QuickBooks",
          logo: "/assets/images/integrations/quickbooks.svg",
          category: "Accounting",
          desc: "See real profit by pairing your sales with your books.",
          features: ["Profit & loss", "Expenses", "Cost of goods"],
          order: 2,
        },
        stripe: {
          name: "Stripe",
          logo: "/assets/images/integrations/stripe.svg",
          category: "Payments",
          desc: "Track online payments, refunds and payouts.",
          features: ["Payments", "Refunds", "Payouts"],
          order: 3,
        },
        google: {
          name: "Google",
          logo: "/assets/images/integrations/google.svg",
          category: "Reviews",
          desc: "Follow your Google reviews and rating.",
          features: ["Reviews", "Rating trend"],
          order: 4,
        },
      };

      // Integrations with a working connect flow; others show "Coming soon"
      const CONNECTABLE = ["shopify", "square", "quickbooks"];

      function esc(v) {
        return String(v == null ? "" : v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function meta(integration) {
        const m = CATALOG[integration.name] || {};
        return {
          name: m.name || integration.display_name || integration.name,
          logo: m.logo || null,
          category: m.category || "Integration",
          desc: m.desc || integration.description || "",
          features: m.features || [],
          order: m.order != null ? m.order : 99,
        };
      }
      function shortDate(iso) {
        return iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
      }

      async function getJson(path) {
        try {
          const res = await fetch(BACKEND_URL + path, { headers: { Authorization: `Bearer ${token}` } });
          return await res.json();
        } catch (e) {
          return {};
        }
      }

      async function loadIntegrations() {
        try {
          const [integrationsData, storesData, quickbooksData, squareData] = await Promise.all([
            getJson("/api/integrations"),
            getJson("/api/integrations/connected"),
            getJson("/api/quickbooks/status"),
            getJson("/integrations/square/status"),
          ]);
          if (!integrationsData.success) throw new Error("integrations");

          availableIntegrations = integrationsData.integrations;
          if (storesData.success) connectedStores = storesData.stores;
          if (quickbooksData.success) quickbooksStatus = quickbooksData;
          squareStatus = squareData && squareData.connected ? squareData : { connected: false };

          renderIntegrations();
        } catch (err) {
          console.error("Load error:", err);
          document.getElementById("content").innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <p>Failed to load integrations. Please refresh the page.</p>
            </div>`;
        }
      }

      function isIntegrationConnected(integration) {
        if (integration.name === "quickbooks") return !!quickbooksStatus.connected;
        if (integration.name === "square") return !!squareStatus.connected;
        return connectedStores.some((s) => s.integration_name === integration.name);
      }

      function renderIntegrations() {
        const sorted = availableIntegrations.slice().sort((a, b) => meta(a).order - meta(b).order);
        const connected = sorted.filter(isIntegrationConnected);
        const available = sorted.filter((i) => !isIntegrationConnected(i));

        const summary = document.getElementById("headSummary");
        summary.hidden = false;
        summary.innerHTML =
          `<span class="dot ${connected.length ? "on" : ""}"></span>` +
          `<span><strong>${connected.length}</strong> of ${sorted.length} connected</span>`;

        let html = "";
        if (connected.length) {
          html += `
            <section class="section">
              <h2 class="section-title">Connected</h2>
              <div class="integrations-grid">${connected.map((i) => renderCard(i, true)).join("")}</div>
            </section>`;
        }
        if (available.length) {
          html += `
            <section class="section">
              <h2 class="section-title">${connected.length ? "Add more" : "Available"}</h2>
              <div class="integrations-grid">${available.map((i) => renderCard(i, false)).join("")}</div>
            </section>`;
        }
        html += `
          <div class="trust-note">
            <span aria-hidden="true">🔒</span>
            <span>Connections use each platform's official sign-in. Aervo stores access keys encrypted, never sees your passwords, and you can disconnect at any time here or from the platform itself.</span>
          </div>`;

        document.getElementById("content").innerHTML = html;
      }

      function renderCard(integration, isConnected) {
        const m = meta(integration);
        const needsAttention = integration.name === "square" && squareStatus.needsReconnect;
        const syncing = integration.name === "square" && isConnected && squareStatus.sync && squareStatus.sync.status === "syncing";

        let pill = "";
        if (needsAttention) pill = `<span class="int-pill warn"><span class="dot warn"></span>Needs attention</span>`;
        else if (syncing) pill = `<span class="int-pill"><span class="dot on"></span>Importing</span>`;
        else if (isConnected) pill = `<span class="int-pill"><span class="dot on"></span>Connected</span>`;

        const logo = m.logo
          ? `<div class="int-logo"><img src="${esc(m.logo)}" alt="" /></div>`
          : `<div class="int-logo fallback" aria-hidden="true">${esc(m.name.charAt(0))}</div>`;

        let body = "";
        let actions = "";
        if (!isConnected && !CONNECTABLE.includes(integration.name)) {
          actions = `<button class="btn btn-ghost btn-sm" disabled>Coming soon</button>`;
        } else if (!isConnected) {
          actions = `<button class="btn btn-primary btn-sm" data-connect="${esc(integration.name)}">Connect ${esc(m.name)}</button>`;
        } else if (integration.name === "square") {
          ({ body, actions } = renderSquareConnected());
        } else if (integration.name === "quickbooks") {
          ({ body, actions } = renderQuickbooksConnected());
        } else {
          ({ body, actions } = renderConnectedStores(integration.name));
        }

        return `
          <article class="int-card ${needsAttention ? "attention" : isConnected ? "connected" : ""}">
            <div class="int-top">
              ${logo}
              <div class="int-title">
                <h3 class="int-name">${esc(m.name)}</h3>
                <div class="int-cat">${esc(m.category)}</div>
              </div>
              ${pill}
            </div>
            <p class="int-desc">${esc(m.desc)}</p>
            ${!isConnected && m.features.length ? `<ul class="int-features">${m.features.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
            ${body ? `<div class="int-body">${body}</div>` : ""}
            <div class="int-actions">${actions}</div>
          </article>`;
      }

      function renderSquareConnected() {
        const s = squareStatus;
        const locations = s.locationCount ? `${s.locationCount} location${s.locationCount === 1 ? "" : "s"}` : "Locations loading";
        let sub = `Connected ${esc(shortDate(s.connectedAt))}`;
        if (s.needsReconnect) sub = `<span class="int-row-sub error">Access expired or was removed. Reconnect to resume syncing.</span>`;
        else if (s.sync && s.sync.status === "syncing") sub = "Importing your sales history…";
        else if (s.sync && s.sync.error) sub = `<span class="int-row-sub error">Last sync had a problem: ${esc(s.sync.error)}</span>`;
        else if (s.sync && s.sync.completedAt) sub = `Last full sync ${esc(shortDate(s.sync.completedAt))}`;
        const body = `
          <div class="int-row">
            <div class="int-row-main">
              <div class="int-row-title">${esc(locations)}</div>
              ${sub.startsWith("<span") ? sub : `<div class="int-row-sub">${sub}</div>`}
            </div>
          </div>`;
        const actions = s.needsReconnect
          ? `<button class="btn btn-primary btn-sm" data-connect="square">Reconnect Square</button>
             <button class="btn btn-ghost btn-sm" data-disconnect-square>Disconnect</button>`
          : `<a class="btn btn-secondary btn-sm" href="/dashboard/square">Open dashboard</a>
             <button class="btn btn-ghost btn-sm" data-disconnect-square>Disconnect</button>`;
        return { body, actions };
      }

      function renderQuickbooksConnected() {
        const body = `
          <div class="int-row">
            <div class="int-row-main">
              <div class="int-row-title">${quickbooksStatus.environment === "production" ? "Company file" : "Sandbox company"}</div>
              <div class="int-row-sub">Connected ${esc(shortDate(quickbooksStatus.connectedAt))}</div>
            </div>
          </div>`;
        const actions = `<button class="btn btn-ghost btn-sm" data-disconnect-qb>Disconnect</button>`;
        return { body, actions };
      }

      function renderConnectedStores(integrationName) {
        const stores = connectedStores.filter((s) => s.integration_name === integrationName);
        const body = stores
          .map(
            (store) => `
            <div class="int-row">
              <div class="int-row-main">
                <div class="int-row-title">${esc(store.store_name)}</div>
                <div class="int-row-sub">${esc(store.store_origin || "")}</div>
              </div>
              <div class="int-row-actions">
                ${
                  store.is_active
                    ? `<span class="badge badge-success">Active</span>`
                    : `<button class="btn btn-ghost btn-sm" data-use-store="${Number(store.id)}">Use this</button>`
                }
                <button class="btn btn-ghost btn-sm" data-remove-store="${Number(store.id)}" data-store-name="${esc(store.store_name)}">Remove</button>
              </div>
            </div>`,
          )
          .join("");
        const actions = `<button class="btn btn-secondary btn-sm" data-connect="${esc(integrationName)}">+ Add another ${integrationName === "shopify" ? "store" : "location"}</button>`;
        return { body, actions };
      }

      // One click handler for every card button (no inline onclick with data in it)
      document.getElementById("content").addEventListener("click", (e) => {
        const el = e.target.closest("button[data-connect], button[data-use-store], button[data-remove-store], button[data-disconnect-qb], button[data-disconnect-square]");
        if (!el) return;
        if (el.dataset.connect) connectIntegration(el.dataset.connect);
        else if (el.dataset.useStore) setActiveStore(Number(el.dataset.useStore));
        else if (el.dataset.removeStore) disconnectStore(Number(el.dataset.removeStore), el.dataset.storeName);
        else if (el.hasAttribute("data-disconnect-qb")) disconnectQuickbooks();
        else if (el.hasAttribute("data-disconnect-square")) disconnectSquare();
      });

      async function disconnectSquare() {
        if (!(await uiConfirm("Disconnect Square?\n\nAervo will stop receiving new sales and your Square dashboard will stop updating. You can reconnect any time.", { confirmText: "Disconnect", danger: true }))) return;
        try {
          const res = await fetch(`${BACKEND_URL}/integrations/square/disconnect`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) throw new Error();
          showToast("Square disconnected", "success");
          loadIntegrations();
        } catch (e) {
          showToast("Couldn't disconnect Square. Please try again.", "error");
        }
      }

      async function connectIntegration(name) {
        if (name === "shopify") {
          const shop = await uiPrompt(
            "Enter your Shopify store domain (e.g., your-store.myshopify.com):",
          );
          if (!shop) return;

          // accepts a store name, your-store.myshopify.com, or any store link
          const normalized = AervoSession.normalizeShop(shop);
          if (!normalized) {
            showToast(
              "Enter your store name or link, like your-store.myshopify.com",
            );
            return;
          }

          const token = localStorage.getItem("aervo_token");
          if (!token) {
            showToast("You're not logged in!");
            window.location.href = "/login";
            return;
          }

          // Simple redirect with token in URL
          try {
            // The server links the store to this logged-in account and returns
            // the Shopify authorization URL (no token goes in the URL).
            const res = await fetch(`${BACKEND_URL}/auth/shopify/connect`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ shop: normalized }),
            });
            const data = await res.json();
            if (!res.ok || !data.url) throw new Error(data.message || "failed");
            window.location.href = data.url;
          } catch (err) {
            showToast(err.message || "Could not start the Shopify connection.", "error");
          }
        } else if (name === "square") {
          // The server identifies the account from the login token, then
          // returns the Square consent URL.
          try {
            const res = await fetch(`${BACKEND_URL}/integrations/square/connect`, {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json();
            if (!res.ok || !data.url) throw new Error(data.message || "failed");
            window.location.href = data.url;
          } catch (err) {
            showToast(
              err.message && err.message !== "failed"
                ? err.message
                : "Could not start the Square connection. Please log in again and retry.",
              "error",
            );
          }
        } else if (name === "quickbooks") {
          connectQuickbooks();
        } else {
          showToast(`${name} integration coming soon!`);
        }
      }

      async function connectQuickbooks() {
        try {
          const res = await fetch(`${BACKEND_URL}/api/quickbooks/connect`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();

          if (!res.ok || !data.success) {
            showToast(data.message || "Could not start QuickBooks connection.");
            return;
          }

          window.location.href = data.url;
        } catch (err) {
          showToast("Error connecting to QuickBooks");
        }
      }

      async function disconnectQuickbooks() {
        if (
          !await uiConfirm(
            "Are you sure you want to disconnect QuickBooks?\n\nThis will remove access to your financial data.",
          )
        )
          return;

        try {
          const res = await fetch(`${BACKEND_URL}/api/quickbooks/disconnect`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
          });

          if (res.ok) {
            showToast("✓ QuickBooks disconnected successfully");
            loadIntegrations();
          } else {
            showToast("Failed to disconnect QuickBooks");
          }
        } catch (err) {
          showToast("Error disconnecting QuickBooks");
        }
      }

      async function setActiveStore(storeId) {
        try {
          const res = await fetch(
            `${BACKEND_URL}/api/integrations/set-active`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ storeId }),
            },
          );

          if (res.ok) {
            showToast(
              "✓ Active store updated! Your dashboard will now show this store's data.",
            );
            loadIntegrations();
          } else {
            showToast("Failed to update active store");
          }
        } catch (err) {
          showToast("Error updating store");
        }
      }

      async function disconnectStore(storeId, storeName) {
        if (
          !await uiConfirm(
            `Are you sure you want to disconnect "${storeName}"?\n\nThis will remove access to this store's data.`,
          )
        )
          return;

        try {
          const res = await fetch(
            `${BACKEND_URL}/api/integrations/disconnect/${storeId}`,
            {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            },
          );

          if (res.ok) {
            showToast("✓ Store disconnected successfully");
            loadIntegrations();
          } else {
            showToast("Failed to disconnect store");
          }
        } catch (err) {
          showToast("Error disconnecting store");
        }
      }

      loadIntegrations();
    </script>
  </body>
</html>
