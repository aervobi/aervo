<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/session.js"></script>
    <title>Team management · Aervo</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/app-nav.css" />
    <script src="/assets/js/ui.js"></script>
    <style>
      /* Layout only; colours, type and spacing come from the shared tokens */
      body {
        min-height: 100vh;
      }
      .tm {
        max-width: 1100px;
        margin: 0 auto;
        padding: calc(var(--nav-h) + var(--space-7)) var(--space-5) var(--space-9);
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
      }
      .tm-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--space-4);
        flex-wrap: wrap;
      }
      .tm-eyebrow {
        font-size: var(--fs-12);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-label);
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .tm-title {
        font-size: var(--fs-28);
        font-weight: var(--fw-heavy);
        letter-spacing: var(--ls-tight);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      .tm-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-4);
      }
      .tm-stat-value {
        font-size: var(--fs-28);
        font-weight: var(--fw-heavy);
      }
      .tm-stat-label {
        font-size: var(--fs-13);
        color: var(--text-secondary);
      }
      .tm-seat-bar {
        height: 6px;
        margin-top: var(--space-2);
        border-radius: var(--radius-pill);
        background: var(--surface-raised);
        overflow: hidden;
      }
      .tm-seat-fill {
        height: 100%;
        background: var(--gradient-primary);
      }
      .tm-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin-bottom: var(--space-4);
      }
      .tm-card-head h2 {
        font-size: var(--fs-18);
        font-weight: var(--fw-bold);
      }
      .tm-sub {
        font-size: var(--fs-13);
        color: var(--text-secondary);
      }

      .tm-invite {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 180px auto;
        gap: var(--space-3);
        align-items: end;
      }
      .tm-invite textarea {
        min-height: 44px;
        resize: vertical;
      }
      .tm-links {
        margin-top: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .tm-link {
        display: flex;
        gap: var(--space-2);
        align-items: center;
      }
      .tm-link input {
        flex: 1;
        min-width: 0;
      }

      .tm-filters {
        display: flex;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      .tm-filters .input {
        width: 220px;
      }
      .tm-table {
        width: 100%;
        border-collapse: collapse;
      }
      .tm-table th {
        text-align: left;
        font-size: var(--fs-12);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-label);
        text-transform: uppercase;
        color: var(--text-muted);
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--border-soft);
      }
      .tm-table td {
        padding: var(--space-3);
        border-bottom: 1px solid var(--border-soft);
        vertical-align: middle;
        font-size: var(--fs-14);
      }
      .tm-table tr:last-child td {
        border-bottom: 0;
      }
      .tm-person {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-width: 0;
      }
      .tm-avatar {
        width: 36px;
        height: 36px;
        flex: none;
        border-radius: 50%;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: var(--fw-bold);
        font-size: var(--fs-14);
        overflow: hidden;
      }
      .tm-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tm-name {
        font-weight: var(--fw-semibold);
      }
      .tm-email {
        font-size: var(--fs-13);
        color: var(--text-secondary);
        overflow-wrap: anywhere;
      }
      .tm-actions {
        display: flex;
        gap: var(--space-2);
        justify-content: flex-end;
        align-items: center;
      }

      /* Row menu (⋯) */
      .tm-menu {
        position: relative;
      }
      .tm-menu summary {
        list-style: none;
        cursor: pointer;
      }
      .tm-menu summary::-webkit-details-marker {
        display: none;
      }
      .tm-menu-list {
        position: absolute;
        right: 0;
        top: calc(100% + var(--space-1));
        z-index: var(--z-popover);
        min-width: 220px;
        padding: var(--space-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--bg-elevated);
        box-shadow: var(--shadow-md);
      }
      .tm-menu-list button {
        display: block;
        width: 100%;
        padding: var(--space-2) var(--space-3);
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text);
        font: inherit;
        font-size: var(--fs-14);
        text-align: left;
        cursor: pointer;
      }
      .tm-menu-list button:hover,
      .tm-menu-list button:focus-visible {
        background: var(--surface-hover);
      }
      .tm-menu-list button.danger {
        color: var(--danger-text);
      }

      /* Section tabs */
      .tm-tabs {
        display: flex;
        gap: var(--space-1);
        border-bottom: 1px solid var(--border-soft);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tm-tab {
        padding: var(--space-3) var(--space-4);
        border-bottom: 2px solid transparent;
        color: var(--text-secondary);
        font-size: var(--fs-14);
        font-weight: var(--fw-medium);
        white-space: nowrap;
        text-decoration: none;
      }
      .tm-tab:hover {
        color: var(--text);
      }
      .tm-tab.active {
        color: var(--text);
        border-bottom-color: var(--primary-from);
      }
      .tm-panel {
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
      }

      /* Team work tabs (team-work-admin.js) */
      .tw-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: var(--space-3);
      }
      .tw-ann {
        padding: var(--space-4) 0;
        border-bottom: 1px solid var(--border-soft);
      }
      .tw-ann:first-child {
        padding-top: 0;
      }
      .tw-ann:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .tw-ann-body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: var(--lh-normal);
      }
      .tw-ann-meta {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        flex-wrap: wrap;
        margin-top: var(--space-2);
        font-size: var(--fs-13);
        color: var(--text-secondary);
      }
      .tw-ann-meta .btn {
        margin-left: auto;
      }
      .tw-readers summary {
        cursor: pointer;
        color: var(--info-text);
      }
      .tw-readers ul {
        list-style: none;
        margin: var(--space-2) 0 0;
        padding: 0;
        display: grid;
        gap: var(--space-1);
      }
      .tw-row {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-3) 0;
        border-bottom: 1px solid var(--border-soft);
      }
      .tw-row:last-child {
        border-bottom: 0;
      }
      .tw-row-main {
        flex: 1;
        min-width: 0;
      }
      .tw-row-stat {
        width: 200px;
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }
      .tw-done .tm-name {
        color: var(--text-muted);
        text-decoration: line-through;
      }
      .tw-notes {
        margin-top: var(--space-1);
        overflow-wrap: anywhere;
      }
      .tw-check {
        width: 18px;
        height: 18px;
        flex: none;
        accent-color: var(--primary-from);
      }
      .tw-meter {
        height: 6px;
        border-radius: var(--radius-pill);
        background: var(--surface-raised);
        overflow: hidden;
        flex: 1;
      }
      .tw-meter > div {
        height: 100%;
        background: var(--gradient-primary);
      }
      .tw-score {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 120px;
      }
      .tw-seg {
        display: flex;
        gap: var(--space-1);
      }
      .tw-task-form {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 170px auto;
        gap: var(--space-3);
        align-items: end;
      }
      .tw-task-notes {
        grid-column: 1 / -1;
      }
      .tw-days {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }
      .tw-day input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .tw-day span {
        display: inline-block;
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-size: var(--fs-13);
        cursor: pointer;
      }
      .tw-day input:checked + span {
        background: rgba(var(--primary-rgb), 0.16);
        border-color: rgba(var(--primary-rgb), 0.5);
        color: var(--text);
      }
      .tw-day input:focus-visible + span {
        box-shadow: var(--focus-ring);
      }
      .tw-items {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .tw-item {
        display: flex;
        gap: var(--space-2);
      }
      .tw-item input {
        flex: 1;
        min-width: 0;
      }

      @media (max-width: 860px) {
        .tw-task-form {
          grid-template-columns: minmax(0, 1fr);
        }
        .tw-row {
          flex-wrap: wrap;
        }
        .tw-row-stat {
          width: 100%;
        }
        .tm-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .tm-invite {
          grid-template-columns: minmax(0, 1fr);
        }
        /* Stack the members table into cards */
        .tm-table thead {
          display: none;
        }
        .tm-table,
        .tm-table tbody,
        .tm-table tr,
        .tm-table td {
          display: block;
          width: 100%;
        }
        .tm-table tr {
          padding: var(--space-3) 0;
          border-bottom: 1px solid var(--border-soft);
        }
        .tm-table tr:last-child {
          border-bottom: 0;
        }
        .tm-table td {
          border: 0;
          padding: var(--space-1) 0;
        }
        .tm-table td[data-label]::before {
          content: attr(data-label) ": ";
          color: var(--text-muted);
        }
        .tm-actions {
          justify-content: flex-start;
          margin-top: var(--space-2);
        }
        .tm-filters .input {
          width: 100%;
        }
      }
      @media (max-width: 560px) {
        .tm {
          padding: calc(var(--nav-h) + var(--space-5)) var(--space-4) var(--space-8);
        }
      }
    </style>
  </head>
  <body>
    <script src="/assets/js/app-nav.js" data-active="team-manage"></script>

    <main class="tm" id="tm">
      <div class="empty-state">Loading…</div>
    </main>

    <script src="/assets/js/team-work-admin.js"></script>
    <script src="/assets/js/team-manage.js"></script>
  </body>
</html>
