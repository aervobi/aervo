<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/session.js"></script>
    <title>Home · Aervo</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/app-nav.css" />
    <script src="/assets/js/ui.js"></script>
    <style>
      /* Layout only; colours, type and spacing come from the shared tokens */
      body {
        min-height: 100vh;
      }
      .home {
        max-width: 1100px;
        margin: 0 auto;
        padding: calc(var(--nav-h) + var(--space-7)) var(--space-5) var(--space-9);
      }

      .home-hero {
        display: flex;
        align-items: center;
        gap: var(--space-6);
        padding: var(--space-7);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        background:
          radial-gradient(600px 240px at 0% 0%, rgba(var(--primary-rgb), 0.12), transparent 70%),
          radial-gradient(600px 240px at 100% 100%, rgba(var(--primary-to-rgb), 0.14), transparent 70%),
          var(--surface);
        margin-bottom: var(--space-6);
      }
      .home-mark {
        width: 88px;
        height: 88px;
        flex: none;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--surface-raised);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-40);
        font-weight: var(--fw-heavy);
        overflow: hidden;
      }
      .home-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .home-eyebrow {
        font-size: var(--fs-12);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-label);
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: var(--space-1);
      }
      .home-store {
        font-size: var(--fs-32);
        font-weight: var(--fw-heavy);
        line-height: var(--lh-tight);
        letter-spacing: var(--ls-tight);
      }
      .home-meta {
        margin-top: var(--space-2);
        color: var(--text-secondary);
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2) var(--space-4);
        align-items: center;
      }
      .home-connected {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--success-text);
        font-weight: var(--fw-semibold);
      }
      .home-connected::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
      }

      .home-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: var(--space-6);
        align-items: start;
      }
      .home-grid > * {
        min-width: 0; /* long previews truncate instead of widening the page */
      }
      .home-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        margin-bottom: var(--space-4);
      }
      .home-card-head h2 {
        font-size: var(--fs-18);
        font-weight: var(--fw-bold);
      }
      .home-row {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3);
        border-radius: var(--radius-md);
        color: inherit;
        text-decoration: none;
      }
      a.home-row:hover {
        background: var(--surface-hover);
      }
      .home-row + .home-row {
        margin-top: var(--space-1);
      }
      .home-avatar {
        width: 36px;
        height: 36px;
        flex: none;
        border-radius: 50%;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: var(--fw-bold);
        font-size: var(--fs-14);
        overflow: hidden;
      }
      .home-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .home-avatar.group {
        background: rgba(var(--primary-to-rgb), 0.18);
      }
      .home-who {
        flex: 1;
        min-width: 0;
      }
      .home-name {
        font-weight: var(--fw-semibold);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .home-sub {
        font-size: var(--fs-13);
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .home-row.unread .home-name,
      .home-row.unread .home-sub {
        color: var(--text);
        font-weight: var(--fw-bold);
      }
      .home-count {
        flex: none;
        min-width: 20px;
        height: 20px;
        padding: 0 var(--space-1);
        border-radius: var(--radius-pill);
        background: var(--gradient-primary);
        color: var(--text-on-primary);
        font-size: var(--fs-11);
        font-weight: var(--fw-bold);
        line-height: 20px;
        text-align: center;
      }
      .home-store-btn {
        margin-top: var(--space-4);
      }
      .home-col {
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
        min-width: 0;
      }
      #homeAnn:not(:empty) {
        margin-bottom: var(--space-6);
      }

      /* Announcements */
      .home-ann {
        border-color: rgba(var(--primary-rgb), 0.35);
      }
      .home-ann-item {
        padding: var(--space-4);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
      }
      .home-ann-item + .home-ann-item {
        margin-top: var(--space-3);
      }
      .home-ann-item.unread {
        box-shadow: inset 3px 0 0 var(--primary-from);
      }
      .home-ann-body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: var(--lh-normal);
      }
      .home-ann-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        margin-top: var(--space-3);
        font-size: var(--fs-13);
        color: var(--text-secondary);
      }

      /* Checklists + tasks */
      .home-list + .home-list {
        margin-top: var(--space-5);
        padding-top: var(--space-5);
        border-top: 1px solid var(--border-soft);
      }
      .home-list-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--space-3);
      }
      .home-progress {
        height: 6px;
        margin: var(--space-2) 0 var(--space-2);
        border-radius: var(--radius-pill);
        background: var(--surface-raised);
        overflow: hidden;
      }
      .home-progress > div {
        height: 100%;
        background: var(--gradient-primary);
        transition: width var(--dur-slow) var(--ease);
      }
      .home-check {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-2);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .home-check:hover {
        background: var(--surface-hover);
      }
      .home-check input {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        flex: none;
        accent-color: var(--primary-from);
      }
      .home-check-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-wrap: anywhere;
      }
      .home-check.done .home-check-text {
        color: var(--text-muted);
        text-decoration: line-through;
      }
      .home-check.done .home-check-text .home-sub {
        text-decoration: none;
      }
      .home-check-who {
        flex: none;
        font-size: var(--fs-12);
        color: var(--text-muted);
      }
      .home-task-notes {
        white-space: normal;
      }
      .home-done-label {
        margin: var(--space-4) 0 var(--space-1);
        font-size: var(--fs-12);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-label);
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .home-note {
        margin-top: var(--space-6);
        font-size: var(--fs-13);
        color: var(--text-muted);
        text-align: center;
      }

      @media (max-width: 860px) {
        .home-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 560px) {
        .home {
          padding: calc(var(--nav-h) + var(--space-5)) var(--space-4) var(--space-8);
        }
        .home-hero {
          flex-direction: column;
          align-items: flex-start;
          gap: var(--space-4);
          padding: var(--space-5);
        }
        .home-mark {
          width: 64px;
          height: 64px;
          font-size: var(--fs-28);
        }
        .home-store {
          font-size: var(--fs-24);
        }
      }
    </style>
  </head>
  <body>
    <script src="/assets/js/app-nav.js" data-active="team"></script>

    <main class="home" id="home">
      <div class="empty-state">Loading…</div>
    </main>

    <script src="/assets/js/team-home.js"></script>
  </body>
</html>
