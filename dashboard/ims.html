<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/session.js"></script>
    <title>Aervo – Inventory Dashboard</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <script src="/assets/js/ui.js"></script>
    <style>/* Platform accent: IMS is purple. Tabs, shop badge and charts use it. */
      :root {
        --accent: #a855f7;
        --accent-rgb: 168, 85, 247;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
      }
      .shop-badge {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .container {
        padding: calc(var(--nav-h) + var(--space-6)) var(--space-7) var(--space-9);
        max-width: var(--container-app);
        margin: 0 auto;
      }
      .welcome {
        margin-bottom: var(--space-7);
      }
      .welcome h1 {
        font-size: var(--fs-32);
        margin: 0 0 var(--space-2);
        color: var(--text);
      }
      .welcome p {
        margin: 0;
        font-size: var(--fs-16);
        color: var(--text-secondary);
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-7);
      }
      .page-header h1 {
        font-size: var(--fs-28);
        color: var(--text);
        margin: 0 0 var(--space-2);
      }
      .page-header p {
        font-size: var(--fs-14);
        color: var(--text-secondary);
        margin: 0;
      }
      .ai-banner {
        background: linear-gradient(
          135deg,
          rgba(var(--primary-to-rgb), 0.28),
          rgba(var(--primary-rgb), 0.08)
        );
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        margin-bottom: var(--space-7);
        border: 1px solid rgba(var(--primary-to-rgb), 0.35);
      }
      .ai-banner-header {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-4);
      }
      .ai-icon {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-20);
      }
      .ai-banner h2 {
        font-size: var(--fs-18);
        color: var(--text);
        margin: 0;
      }
      .insight-item {
        background: var(--surface-hover);
        backdrop-filter: blur(10px);
        border-radius: var(--radius-md);
        padding: var(--space-4) var(--space-4);
        margin-bottom: var(--space-3);
        border: 1px solid var(--border-strong);
        color: var(--text);
        font-size: var(--fs-14);
        line-height: var(--lh-relaxed);
      }
      .insight-item:last-child {
        margin-bottom: 0;
      }
      .insight-priority {
        display: inline-block;
        padding: 2px var(--space-2);
        border-radius: var(--radius-pill);
        font-size: var(--fs-11);
        font-weight: var(--fw-semibold);
        margin-right: var(--space-2);
      }
      .priority-high {
        background: rgba(var(--danger-rgb), 0.2);
        color: var(--danger-text);
      }
      .priority-medium {
        background: rgba(var(--warning-rgb), 0.2);
        color: var(--warning);
      }
      .priority-low {
        background: rgba(var(--success-rgb), 0.2);
        color: var(--success);
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .card h3 {
        font-size: var(--fs-14);
        color: var(--text-secondary);
        margin: 0 0 var(--space-2);
        text-transform: uppercase;
        letter-spacing: var(--ls-label);
      }
      .stat-large {
        font-size: var(--fs-40);
        font-weight: var(--fw-bold);
        color: var(--accent);
        margin: var(--space-2) 0;
        line-height: var(--lh-none);
      }
      .stat-large.green {
        color: var(--success);
      }
      .stat-large.blue {
        color: var(--info);
      }
      .stat-large.yellow {
        color: var(--warning);
      }
      .stat-large.red {
        color: var(--danger);
      }
      .stat-label {
        font-size: var(--fs-13);
        color: var(--text-muted);
        margin-top: var(--space-1);
      }
      .data-table th {
        text-align: left;
        padding: var(--space-3);
        font-size: var(--fs-12);
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-strong);
        font-weight: var(--fw-semibold);
      }
      .data-table td {
        padding: var(--space-3);
        font-size: var(--fs-13);
        border-bottom: 1px solid var(--border);
      }
      .data-table tr.clickable {
        cursor: pointer;
      }
      .data-table tr.clickable:hover {
        background: rgba(var(--accent-rgb), 0.08);
      }
      .badge {
        display: inline-block;
      }
      .chat-container {
        padding: 0;
        height: 360px;
        display: flex;
        flex-direction: column;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        margin-bottom: var(--space-4);
        padding-right: var(--space-1);
      }
      .chat-message {
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
        margin-bottom: var(--space-3);
        font-size: var(--fs-14);
        line-height: var(--lh-normal);
      }
      .chat-message.user {
        background: rgba(var(--accent-rgb), 0.2);
        border: 1px solid rgba(var(--accent-rgb), 0.3);
      }
      .chat-message.ai {
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
      }
      .chat-input-wrapper {
        display: flex;
        gap: var(--space-3);
      }
      .chat-input {
        flex: 1;
        min-height: 44px;
      }
      .btn-send {
        min-height: 44px;
      }/* MODALS */
      
      .modal-overlay.active {
        display: flex;
      }
      .modal.modal-wide {
        max-width: 680px;
      }
      .modal.modal-xl {
        max-width: 820px;
      }
      .modal h3 {
        font-size: var(--fs-18);
        color: var(--text);
        margin-bottom: var(--space-5);
      }
      .form-group label {
        display: block;
        font-size: var(--fs-12);
        color: var(--text-secondary);
        margin-bottom: var(--space-2);
        text-transform: uppercase;
        letter-spacing: var(--ls-label);
      }
      .form-input {
        width: 100%;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-3);
      }
      .btn-add {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
      }
      .filter-btn {
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: transparent;
        color: var(--text-secondary);
        font-size: var(--fs-12);
        cursor: pointer;
        transition: all var(--dur);
      }
      .filter-btn:hover {
        background: var(--surface-raised);
        color: var(--text);
      }
      .filter-btn.active-filter {
        background: rgba(var(--accent-rgb), 0.15);
        border-color: rgba(var(--accent-rgb), 0.4);
        color: var(--text-secondary);
      }
      /* CUSTOMER PROFILE */
      .profile-hero {
        display: flex;
        align-items: center;
        gap: var(--space-5);
        padding: var(--space-6);
        background: rgba(var(--accent-rgb), 0.08);
        border-radius: var(--radius-md);
        border: 1px solid rgba(var(--accent-rgb), 0.2);
        margin-bottom: var(--space-6);
      }
      .profile-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-28);
        font-weight: var(--fw-bold);
        color: var(--text);
        flex-shrink: 0;
      }
      .profile-name {
        font-size: var(--fs-24);
        font-weight: var(--fw-bold);
        color: var(--text);
        margin-bottom: var(--space-1);
      }
      .profile-meta {
        font-size: var(--fs-13);
        color: var(--text-secondary);
      }
      .profile-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-3);
        margin-bottom: var(--space-6);
      }
      .profile-stat {
        background: var(--surface);
        border-radius: var(--radius-md);
        padding: var(--space-4);
        border: 1px solid var(--border);
        text-align: center;
      }
      .profile-stat-val {
        font-size: var(--fs-24);
        font-weight: var(--fw-bold);
        color: var(--accent);
      }
      .profile-stat-label {
        font-size: var(--fs-11);
        color: var(--text-muted);
        margin-top: var(--space-1);
        text-transform: uppercase;
        letter-spacing: var(--ls-label);
      }
      .ai-insight-box {
        background: rgba(var(--accent-rgb), 0.08);
        border: 1px solid rgba(var(--accent-rgb), 0.2);
        border-radius: var(--radius-md);
        padding: var(--space-4);
        margin-bottom: var(--space-4);
      }
      .ai-insight-box .ai-label {
        font-size: var(--fs-11);
        color: var(--accent);
        font-weight: var(--fw-bold);
        text-transform: uppercase;
        letter-spacing: var(--ls-label);
        margin-bottom: var(--space-2);
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .ai-insight-box p {
        font-size: var(--fs-13);
        color: var(--text-secondary);
        line-height: var(--lh-relaxed);
      }
      /* PERIOD TABS */
      .period-tabs {
        display: flex;
        gap: var(--space-1);
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: var(--space-1);
        margin-bottom: var(--space-5);
        width: fit-content;
      }
      .period-tab {
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-sm);
        font-size: var(--fs-12);
        color: var(--text-muted);
        cursor: pointer;
        border: none;
        background: transparent;
        transition: all var(--dur);
      }
      .period-tab.active {
        background: rgba(var(--accent-rgb), 0.2);
        color: var(--text-secondary);
      }
      /* CHART CONTAINER */
      .chart-wrap {
        position: relative;
        height: 220px;
      }/* TOAST */
      
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast.success {
        border-color: rgba(var(--success-rgb), 0.4);
        color: var(--success);
      }
      .toast.error {
        border-color: rgba(var(--danger-rgb), 0.4);
        color: var(--danger-text);
      }
      /* TABLE TOOLBAR */
      .table-toolbar {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin-bottom: var(--space-4);
      }
      .table-toolbar h3 {
        margin: 0;
      }
      .table-toolbar .spacer {
        flex: 1;
      }
      .table-search {
        min-width: 200px;
      }
      .data-table th.sortable {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .data-table th.sortable:hover {
        color: var(--text-secondary);
      }
      .data-table th.sortable .arrow {
        opacity: 0.4;
        font-size: var(--fs-11);
        margin-left: 3px;
      }
      .data-table th.sortable.sorted .arrow {
        opacity: 1;
        color: var(--accent);
      }
      .empty-cta {
        margin-top: var(--space-4);
      }
      .range-tabs {
        display: flex;
        gap: var(--space-1);
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: var(--space-1);
        width: fit-content;
        margin-bottom: var(--space-6);
      }
      .range-tab {
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-sm);
        font-size: var(--fs-12);
        color: var(--text-muted);
        cursor: pointer;
        border: none;
        background: transparent;
        transition: all var(--dur);
        font-family: inherit;
      }
      .range-tab.active {
        background: rgba(var(--accent-rgb), 0.2);
        color: var(--text-secondary);
      }
      @media (max-width: 768px) {
        .table-search {
          min-width: 0;
          width: 100%;
        }
        .container {
          padding: calc(var(--nav-h) + var(--space-4)) var(--space-4) var(--space-7);
        }
        .welcome h1 {
          font-size: var(--fs-24);
        }
        .stat-large {
          font-size: var(--fs-28);
        }
        .grid-4,
        .grid-2,
        .grid-3 {
          grid-template-columns: 1fr;
          gap: var(--space-3);
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .profile-stats {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
      <link rel="stylesheet" href="/assets/css/app-nav.css" />
  </head>
  <body>
    <template id="appNavCenter">
      <div class="nav-tab active" data-view="overview">Overview</div>
      <div class="nav-tab" data-view="products">Products</div>
      <div class="nav-tab" data-view="sales">Sales</div>
      <div class="nav-tab" data-view="customers">Customers</div>
      <div class="nav-tab" data-view="expenses">Expenses</div>
      <div class="nav-tab" data-view="import">Import Data</div>
    </template>
    <template id="appNavRightExtra">
      <div class="shop-badge"><span>●</span><span>Manual IMS</span></div>
    </template>
    <template id="appNavMobile">
      <div class="mobile-nav-tab active" data-view="overview">📊 Overview</div>
      <div class="mobile-nav-tab" data-view="products">📦 Products</div>
      <div class="mobile-nav-tab" data-view="sales">🧾 Sales</div>
      <div class="mobile-nav-tab" data-view="customers">👥 Customers</div>
      <div class="mobile-nav-tab" data-view="expenses">💸 Expenses</div>
      <div class="mobile-nav-tab" data-view="import">📂 Import Data</div>
    </template>
    <script
      src="/assets/js/app-nav.js"
      data-home="/dashboard/ims"
    ></script>

    

    <div class="container">
      <div id="content">
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading your dashboard...</div>
        </div>
      </div>
    </div>

    <!-- PRODUCT MODAL -->
    <div class="modal-overlay" id="productModal">
      <div class="modal">
        <h3 id="productModalTitle">Add Product</h3>
        <input type="hidden" id="pId" />
        <div class="form-row">
          <div class="form-group">
            <label>Product Name *</label
            ><input class="form-input" id="pName" placeholder="e.g. Haircut" />
          </div>
          <div class="form-group">
            <label>SKU</label
            ><input class="form-input" id="pSku" placeholder="e.g. HC-001" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label
            ><input
              class="form-input"
              id="pCategory"
              placeholder="e.g. Services"
            />
          </div>
          <div class="form-group">
            <label>Unit</label
            ><input
              class="form-input"
              id="pUnit"
              placeholder="unit / hour / kg"
              value="unit"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Sale Price ($) *</label
            ><input
              class="form-input"
              id="pSalePrice"
              type="number"
              placeholder="0.00"
              step="0.01"
            />
          </div>
          <div class="form-group">
            <label>Cost Price ($)</label
            ><input
              class="form-input"
              id="pCostPrice"
              type="number"
              placeholder="0.00"
              step="0.01"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Initial Stock</label
            ><input
              class="form-input"
              id="pInitQty"
              type="number"
              placeholder="0"
            />
          </div>
          <div class="form-group">
            <label>Low Stock Alert At</label
            ><input
              class="form-input"
              id="pLowStock"
              type="number"
              placeholder="10"
            />
          </div>
        </div>
        <div class="form-group">
          <label
            style="
              display: flex;
              align-items: center;
              gap: var(--space-2);
              cursor: pointer;
              text-transform: none;
              letter-spacing: 0;
            "
          >
            <input
              type="checkbox"
              id="pIsService"
              style="width: 16px; height: 16px"
            />
            <span>This is a service (no inventory tracking)</span>
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal('productModal')">
            Cancel
          </button>
          <button class="btn-save" onclick="saveProduct()">Save Product</button>
        </div>
      </div>
    </div>

    <!-- SALE MODAL -->
    <div class="modal-overlay" id="saleModal">
      <div class="modal modal-wide">
        <h3 id="saleModalTitle">Log a Sale</h3>
        <div class="form-group">
          <label>Customer (optional)</label>
          <select class="form-input" id="sCustomer">
            <option value="">-- Walk-in --</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Payment Method</label>
            <select class="form-input" id="sPayment">
              <option value="cash">Cash</option>
              <option value="card">Card</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date</label
            ><input class="form-input" id="sSaleDate" type="datetime-local" />
          </div>
        </div>
        <div class="form-group">
          <label>Items</label>
          <div id="saleItems"></div>
          <button
            class="btn-add mt-3"
            onclick="addSaleItemRow()"
          >
            + Add Item
          </button>
        </div>
        <div
          style="
            margin-top: var(--space-3);
            padding: var(--space-3);
            background: rgba(var(--accent-rgb), 0.08);
            border-radius: var(--radius-md);
            border: 1px solid rgba(var(--accent-rgb), 0.2);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: var(--fs-14);
            "
          >
            <span class="text-secondary">Total</span>
            <span style="color: var(--text-secondary); font-weight: var(--fw-bold)" id="saleTotalDisplay"
              >$0.00</span
            >
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal('saleModal')">
            Cancel
          </button>
          <button class="btn-save" onclick="saveSale()">Log Sale</button>
        </div>
      </div>
    </div>

    <!-- CUSTOMER MODAL (Add/Edit) -->
    <div class="modal-overlay" id="customerModal">
      <div class="modal">
        <h3 id="customerModalTitle">Add Customer</h3>
        <input type="hidden" id="cId" />
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label
            ><input class="form-input" id="cFirst" placeholder="Jane" />
          </div>
          <div class="form-group">
            <label>Last Name</label
            ><input class="form-input" id="cLast" placeholder="Doe" />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label
          ><input
            class="form-input"
            id="cEmail"
            type="email"
            placeholder="jane@example.com"
          />
        </div>
        <div class="form-group">
          <label>Phone</label
          ><input
            class="form-input"
            id="cPhone"
            placeholder="+1 (555) 000-0000"
          />
        </div>
        <div class="form-group">
          <label>Notes</label
          ><input class="form-input" id="cNotes" placeholder="Any notes..." />
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal('customerModal')">
            Cancel
          </button>
          <button class="btn-save" onclick="saveCustomer()">
            Save Customer
          </button>
        </div>
      </div>
    </div>

    <!-- CUSTOMER PROFILE MODAL -->
    <div class="modal-overlay" id="customerProfileModal">
      <div class="modal modal-xl">
        <div id="customerProfileContent">
          <div class="loading"><div class="spinner"></div></div>
        </div>
        <div class="modal-actions mt-4">
          <button
            class="btn-cancel"
            onclick="closeModal('customerProfileModal')"
          >
            Close
          </button>
          <button class="btn-save" id="editCustomerBtn">
            ✏️ Edit Customer
          </button>
        </div>
      </div>
    </div>

    <!-- EXPENSE MODAL -->
    <div class="modal-overlay" id="expenseModal">
      <div class="modal">
        <h3 id="expenseModalTitle">Log Expense</h3>
        <input type="hidden" id="eId" />
        <div class="form-group">
          <label>Category *</label>
          <select class="form-input" id="eCategory">
            <option value="rent">Rent</option>
            <option value="supplies">Supplies</option>
            <option value="payroll">Payroll</option>
            <option value="utilities">Utilities</option>
            <option value="marketing">Marketing</option>
            <option value="equipment">Equipment</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Amount ($) *</label
          ><input
            class="form-input"
            id="eAmount"
            type="number"
            placeholder="0.00"
            step="0.01"
          />
        </div>
        <div class="form-group">
          <label>Date</label><input class="form-input" id="eDate" type="date" />
        </div>
        <div class="form-group">
          <label>Description</label
          ><input
            class="form-input"
            id="eDesc"
            placeholder="Optional description..."
          />
        </div>
        <div class="modal-actions">
          <button
            class="btn-danger"
            id="eDeleteBtn"
            style="display: none"
            onclick="deleteExpense()"
          >
            Delete
          </button>
          <button class="btn-cancel" onclick="closeModal('expenseModal')">
            Cancel
          </button>
          <button class="btn-save" onclick="saveExpense()">Save Expense</button>
        </div>
      </div>
    </div>

    <!-- SALE DETAIL MODAL -->
    <div class="modal-overlay" id="saleDetailModal">
      <div class="modal modal-wide">
        <div id="saleDetailContent">
          <div class="loading"><div class="spinner"></div></div>
        </div>
        <div class="modal-actions mt-4">
          <button class="btn-cancel" onclick="closeModal('saleDetailModal')">
            Close
          </button>
        </div>
      </div>
    </div>


    <script>
      const BACKEND_URL = "https://api.aervoapp.com";
      const token = localStorage.getItem("aervo_token");
      if (!token) window.location.href = "/login";

      let currentView = "overview";
      let merchantId = null;
      let imsData = {
        products: [],
        sales: [],
        customers: [],
        expenses: [],
        summary: null,
      };
      let charts = {};
      let salesPeriod = "daily";
      let dateRange = "all"; // all | 7 | 30 | 90
      let productSort = { key: "name", dir: 1 };

      // ── HELPERS ──────────────────────────────────────────────────

      function rangeCutoff() {
        if (dateRange === "all") return null;
        const d = new Date();
        d.setDate(d.getDate() - parseInt(dateRange));
        return d;
      }

      function salesInRange() {
        const cutoff = rangeCutoff();
        if (!cutoff) return imsData.sales;
        return imsData.sales.filter((s) => new Date(s.sale_date) >= cutoff);
      }

      function expensesInRange() {
        const cutoff = rangeCutoff();
        if (!cutoff) return imsData.expenses;
        return imsData.expenses.filter(
          (e) => new Date(e.expense_date) >= cutoff,
        );
      }

      function rangeLabel() {
        return dateRange === "all"
          ? "All time"
          : `Last ${dateRange} days`;
      }

      function renderRangeTabs(active) {
        return `
          <div class="range-tabs">
            ${[
              ["all", "All time"],
              ["7", "7 days"],
              ["30", "30 days"],
              ["90", "90 days"],
            ]
              .map(
                ([v, l]) =>
                  `<button class="range-tab ${dateRange === v ? "active" : ""}" onclick="setDateRange('${v}')">${l}</button>`,
              )
              .join("")}
          </div>`;
      }

      function setDateRange(v) {
        dateRange = v;
        destroyCharts();
        renderView(currentView);
      }

      function csvEscape(v) {
        v = v == null ? "" : String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }

      function downloadCSV(filename, rows) {
        const csv = rows.map((r) => r.map(csvEscape).join(",")).join("\r\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("✓ Exported " + filename);
      }

      function filterTable(input, tableId) {
        const q = input.value.trim().toLowerCase();
        const rows = document.querySelectorAll(
          `#${tableId} tbody tr`,
        );
        let visible = 0;
        rows.forEach((tr) => {
          if (tr.querySelector(".empty-state")) return;
          const match = tr.textContent.toLowerCase().includes(q);
          tr.style.display = match ? "" : "none";
          if (match) visible++;
        });
      }

      // Close any open modal with Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document
            .querySelectorAll(".modal-overlay.active")
            .forEach((m) => m.classList.remove("active"));
        }
      });

      // ── NAV ──────────────────────────────────────────────────────
      // Logout and the mobile drawer toggle live in /assets/js/app-nav.js

      document.querySelectorAll(".nav-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          currentView = tab.dataset.view;
          document
            .querySelectorAll(".nav-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          destroyCharts();
          renderView(currentView);
        });
      });
      document.querySelectorAll(".mobile-nav-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          currentView = tab.dataset.view;
          document
            .querySelectorAll(".mobile-nav-tab,.nav-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById("mobileMenu").classList.remove("active");
          destroyCharts();
          renderView(currentView);
        });
      });

      function destroyCharts() {
        Object.values(charts).forEach((c) => {
          try {
            c.destroy();
          } catch (e) {}
        });
        charts = {};
      }

      // ── INIT ─────────────────────────────────────────────────────
      async function init() {
        try {
          const res = await fetch(`${BACKEND_URL}/api/user/me`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) {
            window.location.href = "/login";
            return;
          }
          const data = await res.json();
          merchantId = String(data.user.id);
          await loadAllData();
          renderView("overview");
        } catch (err) {
          document.getElementById("content").innerHTML =
            `<div class="empty-state text-danger-soft">Failed to load dashboard. Please refresh.</div>`;
        }
      }

      async function loadAllData() {
        const h = { Authorization: `Bearer ${token}` };
        const b = `${BACKEND_URL}/api/ims`;
        const [pR, sR, cR, eR, smR] = await Promise.all([
          fetch(`${b}/products?merchant_id=${merchantId}`, { headers: h }),
          fetch(`${b}/sales?merchant_id=${merchantId}`, { headers: h }),
          fetch(`${b}/customers?merchant_id=${merchantId}`, { headers: h }),
          fetch(`${b}/expenses?merchant_id=${merchantId}`, { headers: h }),
          fetch(`${b}/analytics/summary?merchant_id=${merchantId}`, {
            headers: h,
          }),
        ]);
        imsData.products = pR.ok ? await pR.json() : [];
        imsData.sales = sR.ok ? await sR.json() : [];
        imsData.customers = cR.ok ? await cR.json() : [];
        imsData.expenses = eR.ok ? await eR.json() : [];
        imsData.summary = smR.ok ? await smR.json() : null;
      }

      function renderView(v) {
        const el = document.getElementById("content");
        if (v === "overview") renderOverview(el);
        else if (v === "products") renderProducts(el);
        else if (v === "sales") renderSales(el);
        else if (v === "customers") renderCustomers(el);
        else if (v === "expenses") renderExpenses(el);
        else if (v === "import") renderImport(el);
      }

      function fmt(n) {
        n = parseFloat(n) || 0;
        if (n >= 1000000) return "$" + (n / 1000000).toFixed(1) + "M";
        if (n >= 1000) return "$" + (n / 1000).toFixed(1) + "K";
        return "$" + n.toFixed(2);
      }
      function fmtDate(d) {
        return new Date(d).toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }
      function pct(a, b) {
        return b > 0 ? ((a / b) * 100).toFixed(1) + "%" : "—";
      }

      // ── OVERVIEW ─────────────────────────────────────────────────
      function renderOverview(el) {
        const s = imsData.summary || {};
        let revenue, cogs, grossProfit, expenses, netProfit, orders;
        if (dateRange === "all") {
          revenue = parseFloat(s.total_revenue) || 0;
          cogs = parseFloat(s.total_cogs) || 0;
          grossProfit = parseFloat(s.gross_profit) || 0;
          expenses = parseFloat(s.total_expenses) || 0;
          netProfit = parseFloat(s.net_profit) || 0;
          orders = parseInt(s.total_orders) || 0;
        } else {
          const rs = salesInRange();
          revenue = rs.reduce((a, x) => a + (parseFloat(x.total_amount) || 0), 0);
          cogs = rs.reduce((a, x) => a + (parseFloat(x.total_cost) || 0), 0);
          grossProfit = revenue - cogs;
          expenses = expensesInRange().reduce(
            (a, x) => a + (parseFloat(x.amount) || 0),
            0,
          );
          netProfit = grossProfit - expenses;
          orders = rs.length;
        }
        const lowStock = imsData.products.filter(
          (p) =>
            !p.is_service &&
            parseFloat(p.quantity) <= parseFloat(p.low_stock_threshold || 10),
        );
        const insights = generateInsights(s, lowStock);

        const recentSales = salesInRange();
        el.innerHTML = `
          <div class="welcome"><h1>Business Overview 📦</h1><p>Your manual IMS dashboard — showing <strong class="text-secondary">${rangeLabel().toLowerCase()}</strong>.</p></div>
          ${renderRangeTabs()}
          <div class="ai-banner">
            <div class="ai-banner-header"><div class="ai-icon">🤖</div><h2>AI Insights</h2></div>
            <div>${insights.length ? insights.map((i) => `<div class="insight-item"><span class="insight-priority priority-${i.priority}">${i.label}</span><strong>${i.title}</strong> — ${i.desc}</div>`).join("") : `<div class="insight-item">Add products and log sales to unlock AI insights.</div>`}</div>
          </div>
          <div class="grid-4">
            <div class="card"><h3>Total Revenue</h3><div class="stat-large green">${fmt(revenue)}</div><div class="stat-label">${orders} sales logged</div></div>
            <div class="card"><h3>Gross Profit</h3><div class="stat-large ${grossProfit >= 0 ? "green" : "red"}">${fmt(grossProfit)}</div><div class="stat-label">Margin: ${pct(grossProfit, revenue)}</div></div>
            <div class="card"><h3>Net Profit</h3><div class="stat-large ${netProfit >= 0 ? "green" : "red"}">${fmt(netProfit)}</div><div class="stat-label">After all expenses</div></div>
            <div class="card"><h3>Total Expenses</h3><div class="stat-large yellow">${fmt(expenses)}</div><div class="stat-label">${(dateRange === "all" ? imsData.expenses : expensesInRange()).length} entries</div></div>
          </div>
          <div class="grid-3">
            <div class="card"><h3>Products</h3><div class="stat-large blue">${imsData.products.length}</div><div class="stat-label">${lowStock.length > 0 ? `⚠️ ${lowStock.length} low stock` : "All levels OK"}</div></div>
            <div class="card"><h3>Customers</h3><div class="stat-large">${imsData.customers.length}</div><div class="stat-label">Registered customers</div></div>
            <div class="card"><h3>Avg Sale Value</h3><div class="stat-large blue">${orders > 0 ? fmt(revenue / orders) : "$0.00"}</div><div class="stat-label">Per transaction</div></div>
          </div>
          <div class="grid-2">
            <div class="card"><h3>Recent Sales</h3>
              <div class="table-wrapper"><table class="data-table"><thead><tr><th>Date</th><th>Customer</th><th>Total</th></tr></thead><tbody>
                ${
                  recentSales
                    .slice(0, 6)
                    .map(
                      (s) =>
                        `<tr><td class="text-muted">${fmtDate(s.sale_date)}</td><td>${s.first_name ? s.first_name + " " + s.last_name : "Walk-in"}</td><td class="text-success fw-semibold">${fmt(s.total_amount)}</td></tr>`,
                    )
                    .join("") ||
                  `<tr><td colspan="3" class="empty-state">No sales in this period</td></tr>`
                }
              </tbody></table></div>
            </div>
            <div class="card"><h3>🤖 Ask Aervo AI</h3>
              <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                  <div class="chat-message ai">👋 Hi! I'm <strong>Aervo</strong>.<br><br>
                    • <span class="text-secondary cursor-pointer" onclick="askSuggestion(this)">What are my best-selling products?</span><br>
                    • <span class="text-secondary cursor-pointer" onclick="askSuggestion(this)">How can I improve my profit margin?</span><br>
                    • <span class="text-secondary cursor-pointer" onclick="askSuggestion(this)">Which items should I reorder soon?</span>
                  </div>
                </div>
                <div class="chat-input-wrapper">
                  <input type="text" class="chat-input" id="chatInput" placeholder="Ask anything about your business..." />
                  <button class="btn-send" onclick="sendMessage()">Send</button>
                </div>
              </div>
            </div>
          </div>`;
        document
          .getElementById("chatInput")
          ?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
          });
      }

      function generateInsights(s, lowStock) {
        const insights = [];
        const net = parseFloat(s.net_profit) || 0,
          revenue = parseFloat(s.total_revenue) || 0,
          expenses = parseFloat(s.total_expenses) || 0;
        if (lowStock.length)
          insights.push({
            priority: "high",
            label: "ALERT",
            title: "Low Stock Warning",
            desc: `${lowStock.map((p) => p.name).join(", ")} need restocking soon.`,
          });
        if (revenue > 0 && expenses / revenue > 0.7)
          insights.push({
            priority: "high",
            label: "ALERT",
            title: "High Expense Ratio",
            desc: `Expenses are ${Math.round((expenses / revenue) * 100)}% of revenue. Look for ways to reduce costs.`,
          });
        if (net > 0)
          insights.push({
            priority: "low",
            label: "INSIGHT",
            title: "Business is Profitable",
            desc: `Net profit of ${fmt(net)} — keep monitoring expenses to maintain healthy margins.`,
          });
        if (net < 0)
          insights.push({
            priority: "high",
            label: "ALERT",
            title: "Operating at a Loss",
            desc: `Net loss of ${fmt(Math.abs(net))}. Review expenses and consider pricing adjustments.`,
          });
        if ((s.top_products || []).length)
          insights.push({
            priority: "low",
            label: "INSIGHT",
            title: `Top Performer: ${s.top_products[0].name}`,
            desc: `Generated ${fmt(s.top_products[0].revenue)} in revenue. Consider promoting it further.`,
          });
        return insights.slice(0, 3);
      }

      // ── PRODUCTS TAB ─────────────────────────────────────────────
      function renderProducts(el) {
        // compute per-product stats
        const prodStats = {};
        imsData.sales.forEach((sale) => {
          (Array.isArray(sale.items) ? sale.items : []).forEach((item) => {
            if (!item.product_id) return;
            if (!prodStats[item.product_id])
              prodStats[item.product_id] = { revenue: 0, units: 0 };
            prodStats[item.product_id].revenue +=
              parseFloat(item.line_total) || 0;
            prodStats[item.product_id].units += parseFloat(item.quantity) || 0;
          });
        });

        const marginOf = (p) =>
          p.sale_price > 0
            ? ((p.sale_price - p.cost_price) / p.sale_price) * 100
            : -1;
        const sortVal = {
          name: (p) => (p.name || "").toLowerCase(),
          category: (p) => (p.category || "").toLowerCase(),
          sale_price: (p) => parseFloat(p.sale_price) || 0,
          cost_price: (p) => parseFloat(p.cost_price) || 0,
          margin: (p) => marginOf(p),
          units: (p) => (prodStats[p.id] || { units: 0 }).units,
          revenue: (p) => (prodStats[p.id] || { revenue: 0 }).revenue,
          stock: (p) => (p.is_service ? -1 : parseFloat(p.quantity) || 0),
        };
        const products = [...imsData.products].sort((a, b) => {
          const va = sortVal[productSort.key](a),
            vb = sortVal[productSort.key](b);
          if (va < vb) return -1 * productSort.dir;
          if (va > vb) return 1 * productSort.dir;
          return 0;
        });

        const arrow = (key) =>
          productSort.key === key
            ? `<span class="arrow">${productSort.dir === 1 ? "▲" : "▼"}</span>`
            : `<span class="arrow">▲</span>`;
        const th = (key, label, extra = "") =>
          `<th class="sortable ${productSort.key === key ? "sorted" : ""}" ${extra} onclick="sortProducts('${key}')">${label}${arrow(key)}</th>`;

        el.innerHTML = `
          <div class="page-header">
            <div><h1>Products & Inventory 📦</h1><p>Manage your catalog, stock levels, and performance.</p></div>
            <button class="btn-add" onclick="openAddProduct()">+ Add Product</button>
          </div>

          <div class="grid-2">
            <div class="card"><h3>Revenue by Product</h3><div class="chart-wrap"><canvas id="chartRevProd"></canvas></div></div>
            <div class="card"><h3>Stock Levels</h3><div class="chart-wrap"><canvas id="chartStock"></canvas></div></div>
          </div>

          <div class="card mb-6">
            <div class="table-toolbar">
              <h3>All Products <span style="color:var(--text-muted);font-weight:var(--fw-regular);font-size:var(--fs-12)">(click a row to edit)</span></h3>
              <div class="spacer"></div>
              <input class="table-search" placeholder="Search products…" oninput="filterTable(this,'productsTable')" />
              <button class="btn-ghost" onclick="exportProducts()">⬇ Export CSV</button>
            </div>
            <div class="table-wrapper">
              <table class="data-table" id="productsTable">
                <thead><tr>${th("name", "Product")}${th("category", "Category")}${th("sale_price", "Sale Price")}${th("cost_price", "Cost")}${th("margin", "Margin")}${th("units", "Units Sold")}${th("revenue", "Revenue")}${th("stock", "Stock")}<th></th></tr></thead>
                <tbody>
                  ${
                    products.length
                      ? products
                          .map((p) => {
                            const margin =
                              p.sale_price > 0
                                ? (
                                    ((p.sale_price - p.cost_price) /
                                      p.sale_price) *
                                    100
                                  ).toFixed(0) + "%"
                                : "—";
                            const qty = parseFloat(p.quantity) || 0,
                              threshold =
                                parseFloat(p.low_stock_threshold) || 10;
                            const stockBadge = p.is_service
                              ? `<span class="badge badge-blue">Service</span>`
                              : qty <= 0
                                ? `<span class="badge badge-red">Out of stock</span>`
                                : qty <= threshold
                                  ? `<span class="badge badge-yellow">${qty} — Low</span>`
                                  : `<span class="badge badge-green">${qty}</span>`;
                            const ps = prodStats[p.id] || {
                              revenue: 0,
                              units: 0,
                            };
                            return `<tr class="clickable" onclick="openEditProduct(${p.id})">
                      <td style="color:var(--text);font-weight:var(--fw-medium)">${p.name}${p.sku ? `<div style="font-size:var(--fs-11);color:var(--text-muted)">${p.sku}</div>` : ""}</td>
                      <td class="text-secondary">${p.category || "—"}</td>
                      <td class="text-success fw-semibold">${fmt(p.sale_price)}</td>
                      <td class="text-secondary">${fmt(p.cost_price)}</td>
                      <td><span class="badge ${parseFloat(margin) >= 50 ? "badge-green" : parseFloat(margin) >= 30 ? "badge-yellow" : "badge-red"}">${margin}</span></td>
                      <td class="text-secondary">${ps.units.toFixed(0)}</td>
                      <td style="color:var(--text-secondary);font-weight:var(--fw-semibold)">${fmt(ps.revenue)}</td>
                      <td>${stockBadge}</td>
                      <td style="text-align:right"><button class="btn-ghost btn-sm" title="Delete product" onclick="event.stopPropagation();deleteProduct(${p.id},'${(p.name || "").replace(/'/g, "\\'")}')">✕</button></td>
                    </tr>`;
                          })
                          .join("")
                      : `<tr><td colspan="9" class="empty-state">No products yet.<div class="empty-cta"><button class="btn-add" onclick="openAddProduct()">+ Add your first product</button></div></td></tr>`
                  }
                </tbody>
              </table>
            </div>
          </div>`;

        // Charts
        requestAnimationFrame(() => {
          const labels = products.slice(0, 8).map((p) => p.name);
          const revData = products
            .slice(0, 8)
            .map((p) => (prodStats[p.id] || { revenue: 0 }).revenue.toFixed(2));
          const stockData = products
            .filter((p) => !p.is_service)
            .slice(0, 8)
            .map((p) => parseFloat(p.quantity) || 0);
          const stockLabels = products
            .filter((p) => !p.is_service)
            .slice(0, 8)
            .map((p) => p.name);

          charts.revProd = new Chart(document.getElementById("chartRevProd"), {
            type: "bar",
            data: {
              labels,
              datasets: [
                {
                  label: "Revenue ($)",
                  data: revData,
                  backgroundColor: "rgba(168,85,247,0.6)",
                  borderColor: "#a855f7",
                  borderWidth: 1,
                  borderRadius: 6,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: {
                  ticks: { color: "#6b7a99", font: { size: 10 } },
                  grid: { color: "rgba(255,255,255,0.04)" },
                },
                y: {
                  ticks: {
                    color: "#6b7a99",
                    font: { size: 10 },
                    callback: (v) => "$" + v,
                  },
                  grid: { color: "rgba(255,255,255,0.04)" },
                },
              },
            },
          });
          charts.stock = new Chart(document.getElementById("chartStock"), {
            type: "bar",
            data: {
              labels: stockLabels,
              datasets: [
                {
                  label: "Stock",
                  data: stockData,
                  backgroundColor: stockData.map((v, i) => {
                    const p = products.filter((x) => !x.is_service)[i];
                    return v <= 0
                      ? "rgba(239,68,68,0.6)"
                      : v <= (parseFloat(p?.low_stock_threshold) || 10)
                        ? "rgba(251,191,36,0.6)"
                        : "rgba(52,211,153,0.6)";
                  }),
                  borderRadius: 6,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: {
                  ticks: { color: "#6b7a99", font: { size: 10 } },
                  grid: { color: "rgba(255,255,255,0.04)" },
                },
                y: {
                  ticks: { color: "#6b7a99", font: { size: 10 } },
                  grid: { color: "rgba(255,255,255,0.04)" },
                },
              },
            },
          });
        });
      }

      // ── SALES TAB ─────────────────────────────────────────────
      function renderSales(el) {
        const sales = salesInRange();
        el.innerHTML = `
          <div class="page-header">
            <div><h1>Sales 🧾</h1><p>Transactions, analytics, and trends — ${rangeLabel().toLowerCase()}.</p></div>
            <button class="btn-add" onclick="openLogSale()">+ Log Sale</button>
          </div>
          ${renderRangeTabs()}
          <div class="period-tabs">
            <div class="period-tab ${salesPeriod === "daily" ? "active" : ""}" onclick="setSalesPeriod('daily')">Daily</div>
            <div class="period-tab ${salesPeriod === "weekly" ? "active" : ""}" onclick="setSalesPeriod('weekly')">Weekly</div>
            <div class="period-tab ${salesPeriod === "monthly" ? "active" : ""}" onclick="setSalesPeriod('monthly')">Monthly</div>
          </div>

      function setSalesPeriod(p) {
        salesPeriod = p;
        destroyCharts();
        renderSales(document.getElementById("content"));
      }

      function buildSalesCharts() {
        const rangeSales = salesInRange();
        requestAnimationFrame(() => {
          // Revenue over time
          const grouped = {};
          rangeSales.forEach((s) => {
            const d = new Date(s.sale_date);
            let key;
            if (salesPeriod === "daily")
              key = d.toLocaleDateString("en-US", {
                month: "short",
                day: "numeric",
              });
            else if (salesPeriod === "weekly") {
              const w = getWeek(d);
              key = `W${w}`;
            } else
              key = d.toLocaleDateString("en-US", {
                month: "short",
                year: "2-digit",
              });
            grouped[key] = (grouped[key] || 0) + parseFloat(s.total_amount);
          });
          const timeLabels = Object.keys(grouped).slice(-12);
          const timeData = timeLabels.map((k) => grouped[k].toFixed(2));

          charts.revTime = new Chart(document.getElementById("chartRevTime"), {
            type: "line",
            data: {
              labels: timeLabels,
              datasets: [
                {
                  label: "Revenue",
                  data: timeData,
                  borderColor: "#a855f7",
                  backgroundColor: "rgba(168,85,247,0.1)",
                  tension: 0.4,
                  fill: true,
                  pointBackgroundColor: "#a855f7",
                  pointRadius: 4,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: {
                  ticks: { color: "#6b7a99", font: { size: 10 } },
                  grid: { color: "rgba(255,255,255,0.04)" },
                },
                y: {
                  ticks: {
                    color: "#6b7a99",
                    font: { size: 10 },
                    callback: (v) => "$" + v,
                  },
                  grid: { color: "rgba(255,255,255,0.04)" },
                },
              },
            },
          });

          // Payment methods
          const paymentMap = {};
          rangeSales.forEach((s) => {
            paymentMap[s.payment_method] =
              (paymentMap[s.payment_method] || 0) + 1;
          });
          charts.payment = new Chart(document.getElementById("chartPayment"), {
            type: "doughnut",
            data: {
              labels: Object.keys(paymentMap),
              datasets: [
                {
                  data: Object.values(paymentMap),
                  backgroundColor: [
                    "rgba(168,85,247,0.7)",
                    "rgba(52,211,153,0.7)",
                    "rgba(96,165,250,0.7)",
                  ],
                  borderWidth: 0,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { color: "#9ca7d6", font: { size: 11 } },
                },
              },
            },
          });

          // Best sellers
          const prodStats = {};
          rangeSales.forEach((sale) => {
            (Array.isArray(sale.items) ? sale.items : []).forEach((item) => {
              if (!item.product_name) return;
              if (!prodStats[item.product_name])
                prodStats[item.product_name] = { units: 0, revenue: 0 };
              prodStats[item.product_name].units +=
                parseFloat(item.quantity) || 0;
              prodStats[item.product_name].revenue +=
                parseFloat(item.line_total) || 0;
            });
          });
          const sorted = Object.entries(prodStats).sort(
            (a, b) => b[1].revenue - a[1].revenue,
          );
          document.getElementById("bestSellerBody").innerHTML = sorted.length
            ? sorted
                .slice(0, 6)
                .map(
                  ([name, s]) =>
                    `<tr><td style="color:var(--text);font-weight:var(--fw-medium)">${name}</td><td>${s.units.toFixed(0)}</td><td class="text-success fw-semibold">${fmt(s.revenue)}</td></tr>`,
                )
                .join("")
            : `<tr><td colspan="3" class="empty-state">No sales data yet</td></tr>`;
        });
      }

      function getWeek(d) {
        const s = new Date(d.getFullYear(), 0, 1);
        return Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
      }

      function openSaleDetail(saleId) {
        const sale = imsData.sales.find((s) => s.id === saleId);
        if (!sale) return;
        const items = Array.isArray(sale.items)
          ? sale.items.filter((i) => i.product_name)
          : [];
        const revenue = parseFloat(sale.total_amount) || 0;
        const cost = parseFloat(sale.total_cost) || 0;
        const profit = revenue - cost;
        const customer = sale.first_name
          ? `${sale.first_name} ${sale.last_name || ""}`.trim()
          : "Walk-in";
        document.getElementById("saleDetailContent").innerHTML = `
          <h3 class="mb-2">Sale · ${fmtDate(sale.sale_date)}</h3>
          <p style="color:var(--text-secondary);font-size:var(--fs-13);margin-bottom:var(--space-5)">${customer} · <span class="badge badge-purple">${sale.payment_method}</span></p>
          <div class="table-wrapper" style="margin:0 0 var(--space-5)">
            <table class="data-table">
              <thead><tr><th>Item</th><th>Qty</th><th>Line Total</th></tr></thead>
              <tbody>

                  items.length

                        .map(

                            `<tr><td class="text-primary">${i.product_name}</td><td>${i.quantity}</td><td class="text-success fw-semibold">${fmt(i.line_total)}</td></tr>`,

                        .join("")
                    : `<tr><td colspan="3" class="empty-state">No line items recorded</td></tr>`
                }
              </tbody>
            </table>
          </div>
          <div class="profile-stats">
            <div class="profile-stat"><div class="profile-stat-val text-success">${fmt(revenue)}</div><div class="profile-stat-label">Revenue</div></div>
            <div class="profile-stat"><div class="profile-stat-val text-warning">${fmt(cost)}</div><div class="profile-stat-label">Cost</div></div>
            <div class="profile-stat"><div class="profile-stat-val" style="color:${profit >= 0 ? "var(--success)" : "var(--danger-text)"}">${fmt(profit)}</div><div class="profile-stat-label">Profit</div></div>
          </div>`;
        openModal("saleDetailModal");

      function exportSales() {
        const rows = [
          ["Date", "Customer", "Payment", "Items", "Revenue", "Cost", "Profit"],
        ];
        salesInRange().forEach((s) => {
          const items = (Array.isArray(s.items) ? s.items : [])
            .filter((i) => i.product_name)
            .map((i) => `${i.product_name} x${i.quantity}`)
            .join("; ");
          const rev = parseFloat(s.total_amount) || 0;
          const cost = parseFloat(s.total_cost) || 0;
          rows.push([
            new Date(s.sale_date).toISOString().slice(0, 10),
            s.first_name ? `${s.first_name} ${s.last_name || ""}`.trim() : "Walk-in",
            s.payment_method,
            items,
            rev.toFixed(2),
            cost.toFixed(2),
            (rev - cost).toFixed(2),
          ]);
        });
        downloadCSV("aervo-sales.csv", rows);
      }

      function openCustomerProfile(customerId) {
        const c = imsData.customers.find((x) => x.id === customerId);

        // Get this customer's sales

      function generateCustomerInsights(c, sales, favProducts, avgSpend) {
        const insights = [];
        const fullName =
          [c.first_name, c.last_name].filter(Boolean).join(" ") ||
          "This customer";
        if (sales.length === 0) {
          insights.push({
            label: "New Customer",
            text: `${fullName} hasn't made a purchase yet. Consider reaching out with a welcome offer to drive their first visit.`,
          });
          return insights;
        }
        if (sales.length >= 3)
          insights.push({
            label: "Loyal Customer",
            text: `${fullName} has visited ${sales.length} times — that's a strong retention signal. Consider offering a loyalty reward to keep them coming back.`,
          });
        else if (sales.length === 1)
          insights.push({
            label: "First-Time Buyer",
            text: `${fullName} has only visited once. A follow-up message or special offer could convert them into a returning customer.`,
          });
        if (favProducts.length)
          insights.push({
            label: "Product Preference",
            text: `${fullName} frequently purchases ${favProducts[0][0]}. Make sure it stays in stock and consider upselling complementary products.`,
          });
        const lastSale = sales[0];
        const daysSince = Math.floor(
          (Date.now() - new Date(lastSale.sale_date)) / 86400000,
        );
        if (daysSince > 30)
          insights.push({
            label: "Re-engagement Opportunity",
            text: `${fullName} hasn't visited in ${daysSince} days. A targeted promotion or reminder could bring them back.`,
          });
        else
          insights.push({
            label: "Recent Visit",
            text: `${fullName} visited ${daysSince === 0 ? "today" : daysSince === 1 ? "yesterday" : `${daysSince} days ago`} and spent ${fmt(parseFloat(lastSale.total_amount))}. They're an active customer.`,
          });
        return insights;
      }

      function updateSaleRow(idx) {
        const sel = document.getElementById(`sItem_${idx}_prod`);
        const qty =
          parseFloat(document.getElementById(`sItem_${idx}_qty`).value) || 0;
        const opt = sel.options[sel.selectedIndex];
        const price = parseFloat(opt?.dataset?.price) || 0,
          cost = parseFloat(opt?.dataset?.cost) || 0;
        document.getElementById(`sItem_${idx}_total`).textContent = fmt(
          price * qty,
        );
        saleItemRows[idx] = {
          product_id: sel.value,
          quantity: qty,
          unit_price: price,
          unit_cost: cost,
        };
        document.getElementById("saleTotalDisplay").textContent = fmt(
          saleItemRows.reduce(
            (s, r) => s + (r.unit_price || 0) * (r.quantity || 0),
            0,

        );

      // ── CHAT ─────────────────────────────────────────────────────
      let isAIThinking = false;
      async function sendMessage() {
        if (isAIThinking) return;
        const input = document.getElementById("chatInput");
        const messages = document.getElementById("chatMessages");
        const message = input?.value?.trim();
        if (!message || !messages) return;
        const userMsg = document.createElement("div");
        userMsg.className = "chat-message user";
        userMsg.textContent = message;
        messages.appendChild(userMsg);
        input.value = "";
        messages.scrollTop = messages.scrollHeight;
        isAIThinking = true;
        const typingEl = document.createElement("div");
        typingEl.className = "chat-message ai";
        typingEl.id = "typingIndicator";
        typingEl.innerHTML =
          "<em class='text-muted'>Aervo is thinking...</em>";
        messages.appendChild(typingEl);
        input.disabled = true;
        try {
          const res = await fetch(`${BACKEND_URL}/api/ai/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ message, merchantId, platform: "ims" }),
          });
          const data = await res.json();
          document.getElementById("typingIndicator")?.remove();
          const aiMsg = document.createElement("div");
          aiMsg.className = "chat-message ai";
          aiMsg.innerHTML = (data.reply || "Sorry, I couldn't respond.")
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/\n/g, "<br>");
          messages.appendChild(aiMsg);
        } catch {
          document.getElementById("typingIndicator")?.remove();
          const errMsg = document.createElement("div");
          errMsg.className = "chat-message ai";
          errMsg.textContent =
            "Sorry, I had trouble responding. Please try again.";
          messages.appendChild(errMsg);
        }
        isAIThinking = false;
        input.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
      function askSuggestion(el) {

      function handleImportDrop(e) {
        e.preventDefault();
        const dropZone = document.getElementById("importDropZone");
        if (dropZone) {
          dropZone.style.borderColor = "rgba(255,255,255,0.15)";
          dropZone.style.background = "";
        }
        const f = e.dataTransfer.files[0];
        if (f) setImportFile(f);
      }
      function handleImportSelect(e) {
        const f = e.target.files[0];
        if (f) setImportFile(f);
      }
      function setImportFile(f) {
        importCsvFile = f;
        const info = document.getElementById("importFileInfo");
        const name = document.getElementById("importFileName");
        if (info && name) {
          name.textContent = f.name;
          info.style.display = "flex";
        }
      }
      function clearImportFile() {
        importCsvFile = null;
        const info = document.getElementById("importFileInfo");
        if (info) info.style.display = "none";
        const input = document.getElementById("importFileInput");
        if (input) input.value = "";
      }

      async function submitImport() {
        if (!importCsvFile) {
          const err = document.getElementById("importError");
          if (err) {
            err.textContent = "Please select a file first.";
            err.style.display = "block";
          }
          return;
        }
        const btn = document.getElementById("importSubmitBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Uploading…";
        }
        const label =
          document.getElementById("importPeriodLabel")?.value.trim() ||
          "Upload " +
            new Date().toLocaleDateString("en-US", {
              month: "short",
              year: "numeric",
            });
        const formData = new FormData();
        formData.append("file", importCsvFile);
        formData.append("period_label", label);
        try {
          const res = await fetch(BACKEND_URL + "/api/csv/upload", {
            method: "POST",
            headers: { Authorization: "Bearer " + token },
            body: formData,
          });
          const data = await res.json();
          if (!data.success) throw new Error(data.message || "Upload failed");
          if (btn) {
            btn.disabled = false;
            btn.textContent = "⚡ Import & Analyze";
          }
          clearImportFile();
          showToast("✓ " + label + " imported successfully", "success");
          loadImportHistory();
        } catch (err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "⚡ Import & Analyze";
          }
          const errEl = document.getElementById("importError");
          if (errEl) {
            errEl.textContent =
              err.message || "Upload failed. Please try again.";
            errEl.style.display = "block";
          }
        }
      }

      async function loadImportHistory() {
        const container = document.getElementById("importHistory");
        if (!container) return;
        try {
          const res = await fetch(BACKEND_URL + "/api/csv/uploads", {
            headers: { Authorization: "Bearer " + token },
          });
          const data = await res.json();
          if (!data.success || !data.uploads?.length) {
            container.innerHTML = `<div class="empty-state" style="margin-top:0">No imports yet — upload your first file above.</div>`;
            return;
          }
          container.innerHTML = `
            <div class="card">
              <h3 class="mb-4">Import History</h3>
              <div class="table-wrapper">
                <table class="data-table">
                  <thead><tr><th>Period</th><th>Uploaded</th><th>Revenue</th><th>Orders</th></tr></thead>
                  <tbody>
                    ${data.uploads
                      .map(
                        (u) => `
                      <tr>
                        <td>${u.period_label || "—"}</td>
                        <td class="text-muted">${new Date(u.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</td>
                        <td class="text-success fw-semibold">${u.summary?.totalRevenue ? "$" + parseFloat(u.summary.totalRevenue).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—"}</td>
                        <td>${u.summary?.totalOrders || "—"}</td>
                      </tr>
                    `,
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } catch (e) {
          container.innerHTML = `<div class="empty-state text-danger-soft">Could not load import history.</div>`;
        }
      }

      init();
    </script>
  </body>
</html>
