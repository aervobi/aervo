    <script>
      if (window.shopify) {
        window.shopify.idToken().catch(() => {
          const search = new URLSearchParams(window.location.search);
          const shop = search.get("shop") || localStorage.getItem("shopify_shop");
          if (shop) {
            // keep Shopify's signed launch parameters so the server can verify them
            if (!search.get("shop")) search.set("shop", shop);
            window.top.location.href = `https://api.aervoapp.com/auth/shopify/?${search}`;
          }
        });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>/* Platform accent: Shopify is blue. Tabs, shop badge and charts use it. */
      :root {
        --accent: #60a5fa;
        --accent-rgb: 96, 165, 250;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
      }
      .shop-badge {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .container {
        padding: calc(var(--nav-h) + var(--space-6)) var(--space-7) var(--space-9);
        max-width: var(--container-app);
        margin: 0 auto;
      }
      .welcome {
        margin-bottom: var(--space-7);
      }
      .welcome h1 {
        font-size: var(--fs-32);
        margin: 0 0 var(--space-2);
        color: var(--text);
      }
      .welcome p {
        margin: 0;
        font-size: var(--fs-16);
        color: var(--text-secondary);
      }
      .ai-banner {
        background: linear-gradient(
          135deg,
          rgba(var(--primary-to-rgb), 0.28),
          rgba(var(--primary-rgb), 0.08)
        );
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        margin-bottom: var(--space-7);
        border: 1px solid rgba(var(--primary-to-rgb), 0.35);
      }
      .ai-banner-header {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-4);
      }
      .ai-icon {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-20);
      }
      .ai-banner h2 {
        font-size: var(--fs-18);
        color: var(--text);
        margin: 0;
      }
      .insight-item {
        background: var(--surface-hover);
        backdrop-filter: blur(10px);
        border-radius: var(--radius-md);
        padding: var(--space-4) var(--space-4);
        margin-bottom: var(--space-3);
        border: 1px solid var(--border-strong);
        color: var(--text);
        font-size: var(--fs-14);
        line-height: var(--lh-relaxed);
      }
      .insight-item:last-child {
        margin-bottom: 0;
      }
      .insight-priority {
        display: inline-block;
        padding: 2px var(--space-2);
        border-radius: var(--radius-pill);
        font-size: var(--fs-11);
        font-weight: var(--fw-semibold);
        margin-right: var(--space-2);
      }
      .priority-high {
        background: rgba(var(--danger-rgb), 0.2);
        color: var(--danger-text);
      }
      .priority-medium {
        background: rgba(var(--warning-rgb), 0.2);
        color: var(--warning);
      }
      .priority-low {
        background: rgba(var(--success-rgb), 0.2);
        color: var(--success);
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: var(--space-5);
        margin-bottom: var(--space-6);
      }
      .card h3 {
        font-size: var(--fs-14);
        color: var(--text-secondary);
        margin: 0 0 var(--space-2);
        text-transform: uppercase;
        letter-spacing: var(--ls-label);
      }
      .stat-large {
        font-size: var(--fs-40);
        font-weight: var(--fw-bold);
        color: var(--info);
        margin: var(--space-2) 0;
        line-height: var(--lh-none);
      }
      .stat-change {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--fs-13);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-sm);
        margin-top: var(--space-2);
      }
      .stat-change.positive {
        background: rgba(var(--success-rgb), 0.15);
        color: var(--success);
      }
      .stat-change.negative {
        background: rgba(var(--danger-rgb), 0.15);
        color: var(--danger-text);
      }
      .stat-label {
        font-size: var(--fs-13);
        color: var(--text-muted);
        margin-top: var(--space-1);
      }
      .action-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .action-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: var(--space-4);
        margin-bottom: var(--space-3);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        cursor: pointer;
        transition: all var(--dur) ease;
        min-height: 48px;
      }
      .action-item:hover {
        background: rgba(var(--info-rgb), 0.1);
        border-color: rgba(var(--info-rgb), 0.3);
      }
      .action-item:hover {
        background: rgba(var(--info-rgb), 0.1);
        border-color: rgba(var(--info-rgb), 0.3);
      }
      .action-icon {
        width: 32px;
        height: 32px;
        background: rgba(var(--info-rgb), 0.2);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-16);
      }
      .action-content {
        flex: 1;
      }
      .action-title {
        font-size: var(--fs-14);
        color: var(--text);
        margin-bottom: 2px;
      }
      .action-desc {
        font-size: var(--fs-12);
        color: var(--text-muted);
      }
      .chat-container {
        border-radius: var(--radius-lg);
        padding: var(--space-5);
        height: 380px;
        display: flex;
        flex-direction: column;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        margin-bottom: var(--space-4);
        padding-right: var(--space-2);
      }
      .chat-message {
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
        margin-bottom: var(--space-3);
        font-size: var(--fs-14);
        line-height: var(--lh-normal);
      }
      .chat-message.user {
        background: rgba(var(--info-rgb), 0.2);
        border: 1px solid rgba(var(--info-rgb), 0.3);
      }
      .chat-message.ai {
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
      }
      .chat-input-wrapper {
        display: flex;
        gap: var(--space-3);
      }
      .chat-input {
        flex: 1;
        min-height: 44px;
      }
      .btn-send {
        min-height: 44px;
        min-width: 44px;
      }
      .data-table th {
        text-align: left;
        padding: var(--space-3);
        font-size: var(--fs-12);
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-strong);
        font-weight: var(--fw-semibold);
      }
      .data-table td {
        padding: var(--space-3);
        font-size: var(--fs-13);
        border-bottom: 1px solid var(--border);
      }
      .data-table tr:hover {
        background: rgba(var(--info-rgb), 0.05);
      }
      
      .error-banner {
        background: rgba(var(--danger-rgb), 0.1);
        border: 1px solid rgba(var(--danger-rgb), 0.3);
        border-radius: var(--radius-md);
        padding: var(--space-4);
        margin-bottom: var(--space-5);
        color: var(--danger-text);
        font-size: var(--fs-14);
      }
      .connect-cta {
        text-align: center;
        padding: var(--space-10) var(--space-6);
      }
      .connect-cta h2 {
        font-size: var(--fs-24);
        margin-bottom: var(--space-3);
        color: var(--text);
      }
      .connect-cta p {
        color: var(--text-secondary);
        font-size: var(--fs-16);
        margin-bottom: var(--space-6);
        line-height: var(--lh-relaxed);
      }
      .btn-primary {
        display: inline-block;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (max-width: 768px) {
        /* keep nav clean */
        .nav-right #shopBadge,
        .nav-right #integrationSwitcher {
          display: none !important;
        }
        .container {
          padding: calc(var(--nav-h) + var(--space-2)) var(--space-3) var(--space-6);
        }
        .welcome h1 {
          font-size: var(--fs-24);
        }
        .welcome p {
          font-size: var(--fs-14);
        }
        .grid-4,
        .grid-2 {
          grid-template-columns: 1fr;
          gap: var(--space-4);
        }
        .stat-large {
          font-size: var(--fs-32);
        }
        .ai-banner {
          padding: var(--space-4);
          margin-bottom: var(--space-5);
        }
        .ai-icon {
          width: 32px;
          height: 32px;
          font-size: var(--fs-16);
        }
        .ai-banner h2 {
          font-size: var(--fs-16);
        }
        .insight-item {
          padding: var(--space-3);
          font-size: var(--fs-13);
        }
        .data-table th,
        .data-table td {
          padding: var(--space-2) var(--space-2);
        }
        .chat-container {
          height: 320px;
          min-height: 280px;
        }
        .chat-messages {
          max-height: 220px;
        }
        .action-item {
          padding: var(--space-3);
          min-height: 44px;
        }
        .action-title {
          font-size: var(--fs-13);
        }
        .action-desc {
          font-size: var(--fs-11);
        }
        canvas {
          max-height: 220px !important;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: calc(var(--nav-h) - var(--space-1)) var(--space-2) var(--space-5);
        }
        .welcome h1 {
          font-size: var(--fs-20);
        }
        .stat-large {
          font-size: var(--fs-28);
        }
        .grid-4 {
          grid-template-columns: 1fr;
          gap: var(--space-3);
        }
        .card h3 {
          font-size: var(--fs-11);
        }
        .stat-change {
          font-size: var(--fs-11);
          padding: 3px var(--space-2);
        }
        canvas {
          max-height: 200px !important;
          max-width: 100%;
        }
      }
    </style>

  </head>
  <body>
    <template id="appNavBrandExtra">
      <div

        style="

      >
        <img

            object-fit: contain;
          "
        />
        <span
          id="companyLogoName"

        ></span>

    <template id="appNavCenter">
      <div class="nav-tab active" data-view="overview">Overview</div>
      <div class="nav-tab" data-view="analytics">Analytics</div>
      <div class="nav-tab" data-view="inventory">Inventory</div>
      <div class="nav-tab" data-view="customers">Customers</div>
    </template>
    <template id="appNavRightExtra">
      <a
        href="/dashboard/square"
        id="integrationSwitcher"
        style="
          display: none;
          text-decoration: none;
          padding: var(--space-2) var(--space-4);
          border-radius: var(--radius-pill);
          background: rgba(var(--success-rgb), 0.1);
          border: 1px solid rgba(var(--success-rgb), 0.25);

        "
      >
        ⬛ Switch to Square
      </a>

    <template id="appNavMobile">
      <div class="mobile-nav-tab active" data-view="overview">📊 Overview</div>
      <div class="mobile-nav-tab" data-view="analytics">📈 Analytics</div>
      <div class="mobile-nav-tab" data-view="inventory">📦 Inventory</div>
      <div class="mobile-nav-tab" data-view="customers">👥 Customers</div>
    </template>
    <script
      src="/assets/js/app-nav.js"
      data-home="/dashboard/shopify"
    ></script>

    

    <div class="container">
      <div id="content">
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading your Aervo dashboard...</div>
        </div>
      </div>
    </div>

    <script>
      const BACKEND_URL = "https://api.aervoapp.com";
      // Disable App Bridge fetch interceptor
      if (window.shopify) {
        window.__SHOPIFY_DEV_TOOLS_HOOK__ = null;
      }
      // Hide nav links when embedded in Shopify iframe
      if (window.self !== window.top) {
        document.addEventListener("DOMContentLoaded", function () {
          const settingsLink = document.querySelector('a[href="/settings"]');
          if (settingsLink) settingsLink.style.display = "none";

          const reportsLink = document.querySelector('a[href="/reports"]');
          if (reportsLink) reportsLink.style.display = "none";

          const intelligenceLink = document.querySelector(
            'a[href="/intelligence"]',
          );
          if (intelligenceLink) intelligenceLink.style.display = "none";
        });
      }
      const urlParams = new URLSearchParams(window.location.search);
      let token = localStorage.getItem("aervo_token");

      // After installing / connecting from Shopify we arrive with a one-time
      // code (valid ~2 minutes, usable once). Swap it for a session cookie.
      // Nothing long-lived is ever placed in the URL.
      const loginCode = urlParams.get("code");
      const loginReady = (async () => {
        if (!loginCode) return;
        try {
          const res = await fetch(`${BACKEND_URL}/auth/shopify/exchange`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: loginCode }),
          });
          const data = await res.json();
          if (data.success) {
            AervoSession.mark();
            token = localStorage.getItem("aervo_token");
            if (data.user)
              localStorage.setItem("aervo_user", JSON.stringify(data.user));
          }
        } catch (e) {}
        const shop = urlParams.get("shop");
        window.history.replaceState(
          {},
          "",
          window.location.pathname + (shop ? "?shop=" + encodeURIComponent(shop) : ""),
        );
      })();

      // If inside Shopify iframe, get session token via App Bridge
      async function initShopifyAuth() {
        await loginReady;
        const isStandalone =
          urlParams.get("standalone") === "1" || !window.shopify;

        if (!isStandalone && window.shopify) {
          try {
            const sessionToken = await window.shopify.idToken();
            const shop =
              urlParams.get("shop") || localStorage.getItem("shopify_shop");
            if (sessionToken && shop) {
              const res = await fetch(
                `${BACKEND_URL}/auth/shopify/session-token`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ sessionToken, shop }),
                },
              );
              const data = await res.json();
              if (data.success && data.token) {
                token = data.token;
                localStorage.setItem("aervo_token", token);
              }
            }
          } catch (e) {
            console.log("App Bridge not available, using stored token");
          }
        }
        if (!token) window.location.href = "/login";
      }

      initShopifyAuth();

      // Try to get Shopify session token if App Bridge is available
      async function getSessionToken() {
        try {
          if (window.shopify && window.shopify.idToken) {
            const sessionToken = await window.shopify.idToken();
            return sessionToken;
          }
        } catch (e) {}
        return null;
      }

      loginReady.then(() => {
        if (!token) window.location.href = "/login";
      });
      // ─────────────────────────────────────────────────────────────────────────────
      // SHOPIFY DASHBOARD PATCH — /dashboard/shopify/index.html
      //
      // Find this line near the top of the <script> block:
      //
      //   const token = localStorage.getItem("aervo_token");
      //   if (!token) window.location.href = "/login";
      //
      // Add the block below IMMEDIATELY AFTER those two lines:
      // ─────────────────────────────────────────────────────────────────────────────

      // Redirect users to their correct dashboard based on the platform
      // chosen at onboarding. "csv" and "ims" both mean the manual
      // Inventory Management System dashboard.
      (async () => {
        try {
          const res = await fetch("https://api.aervoapp.com/api/user/me", {
            headers: { Authorization: "Bearer " + token },
          });
          const data = await res.json();
          const platform = data.user && data.user.platform;
          if (platform === "csv" || platform === "ims") {
            window.location.href = "/dashboard/ims";
          } else if (platform === "square") {
            window.location.href = "/dashboard/square";
          }
        } catch (e) {}
      })();

      // ─────────────────────────────────────────────────────────────────────────────
      // END OF PATCH
      // ─────────────────────────────────────────────────────────────────────────────

      let currentView = "overview";
      let userData = null;
      let shopData = null;
      let realData = {
        overview: null,
        orders: [],
        inventory: null,
        customers: null,
      };

      // Logout and the mobile drawer toggle live in /assets/js/app-nav.js
      const mobileMenu = document.getElementById("mobileMenu");

      // ============= TAB NAVIGATION =============
      document.querySelectorAll(".nav-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          currentView = tab.dataset.view;
          document
            .querySelectorAll(".nav-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          renderView(currentView);
        });
      });

      // Mobile tab navigation
      document.querySelectorAll(".mobile-nav-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          currentView = tab.dataset.view;
          document
            .querySelectorAll(".mobile-nav-tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".nav-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          mobileMenu.classList.remove("active"); // Close menu after selection
          renderView(currentView);
        });
      });

      // ============= LOAD USER + SHOPIFY DATA =============
      async function loadUserData() {
        try {
          const response = await fetch(`${BACKEND_URL}/api/user/me`, {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              localStorage.removeItem("aervo_token");
              window.location.href = "/login";
              return;
            }
            throw new Error("Failed to fetch user data");
          }

          const data = await response.json();
          if (!data.success)
            throw new Error(data.message || "Failed to load user data");

          userData = data.user;
          shopData = data.shop;

          shopData = data.shop;

          // Company logo in nav
          if (userData.companyLogoUrl || userData.companyName) {
            const container = document.getElementById("companyLogoContainer");
            container.style.display = "flex";
            if (userData.companyLogoUrl) {
              document.getElementById("companyLogo").src =
                userData.companyLogoUrl;
              document.getElementById("companyLogo").style.display = "block";
            } else {
              document.getElementById("companyLogo").style.display = "none";
            }
            document.getElementById("companyLogoName").textContent =
              userData.companyName || "";
          }
          // Check if Square is also connected
          const squareStatus = await fetch(
            `${BACKEND_URL}/integrations/square/status?merchantId=${String(userData.id)}`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          const squareData = await squareStatus.json();
          if (squareData.connected) {
            document.getElementById("integrationSwitcher").style.display =
              "inline-flex";
          }

          if (shopData) {
            document.getElementById("shopBadge").style.display = "flex";
            document.getElementById("shopName").textContent =
              shopData.shopOrigin.replace(".myshopify.com", "");
            await fetchAllShopifyData(shopData.shopOrigin);
          }

          renderView("overview");
          loadHealthScore(); // ADD THIS
        } catch (error) {
          console.error("Dashboard load error:", error);
          document.getElementById("content").innerHTML = `
            <div class="error-banner">
              <strong>⚠ Error loading dashboard</strong><br>
              ${error.message || "Something went wrong. Please try refreshing the page."}
            </div>
            <div class="card" style="text-align:center;padding:var(--space-8);">
              <button class="btn-primary" onclick="location.reload()">Refresh Page</button>
            </div>`;
        }
      }

      // ============= FETCH ALL SHOPIFY DATA =============
      async function fetchAllShopifyData(shop) {
        try {
          const h = { Authorization: `Bearer ${token}` };
          const [oRes, ordRes, invRes, cusRes] = await Promise.all([
            fetch(`${BACKEND_URL}/api/shopify/overview?shop=${shop}`, {
              headers: h,
            }),
            fetch(`${BACKEND_URL}/api/shopify/orders?shop=${shop}&limit=50`, {
              headers: h,
            }),
            fetch(`${BACKEND_URL}/api/shopify/inventory?shop=${shop}`, {
              headers: h,
            }),
            fetch(`${BACKEND_URL}/api/shopify/customers?shop=${shop}`, {
              headers: h,
            }),
          ]);
          const [o, ord, inv, cus] = await Promise.all([
            oRes.json(),
            ordRes.json(),
            invRes.json(),
            cusRes.json(),
          ]);
          realData.overview = o.success ? o.data : null;

      // ============= RENDER CUSTOMERS =============
      function renderCustomers() {
        const c = realData.customers;
        const orders = realData.orders || [];

        if (!c)
          return `<div class="loading"><div class="spinner"></div><div>Loading customers...</div></div>`;

        // === ADVANCED CUSTOMER SEGMENTATION ===
        const today = new Date();
        const thirtyDaysAgo = new Date(
          today.getTime() - 30 * 24 * 60 * 60 * 1000,
        );
        const sixtyDaysAgo = new Date(
          today.getTime() - 60 * 24 * 60 * 60 * 1000,
        );

        // Segment customers by value
        const avgLTV = parseFloat(c.avgLifetimeValue);
        const vipCustomers = c.topCustomers.filter(
          (cu) => parseFloat(cu.totalSpent) > avgLTV * 2,
        );
        const regularCustomers = c.topCustomers.filter(
          (cu) =>
            parseFloat(cu.totalSpent) >= avgLTV &&
            parseFloat(cu.totalSpent) <= avgLTV * 2,
        );
        const newCustomers = c.topCustomers.filter(
          (cu) => cu.ordersCount === 1,
        );

        // Calculate at-risk customers (haven't ordered in 60+ days)
        const customerLastOrder = {};
        orders.forEach((order) => {
          if (order.customer && order.customer.id) {
            const orderId = order.customer.id;
            const orderDate = new Date(order.created_at);
            if (
              !customerLastOrder[orderId] ||
              orderDate > customerLastOrder[orderId]
            ) {
              customerLastOrder[orderId] = orderDate;
            }
          }
        });

        const atRiskCount = Object.values(customerLastOrder).filter(
          (date) => date < sixtyDaysAgo,
        ).length;

        // New customers in last 30 days
        const recentCustomerIds = new Set();
        orders.forEach((order) => {
          if (
            order.customer &&
            order.customer.id &&
            new Date(order.created_at) > thirtyDaysAgo
          ) {
            recentCustomerIds.add(order.customer.id);
          }
        });

        // Calculate purchase frequency
        const ordersByCustomer = {};
        orders.forEach((order) => {
          if (order.customer && order.customer.id) {
            const cid = order.customer.id;
            if (!ordersByCustomer[cid]) ordersByCustomer[cid] = [];
            ordersByCustomer[cid].push(new Date(order.created_at));
          }
        });

        let totalDaysBetween = 0;
        let pairCount = 0;
        Object.values(ordersByCustomer).forEach((dates) => {
          if (dates.length > 1) {
            dates.sort((a, b) => a - b);
            for (let i = 1; i < dates.length; i++) {
              const daysBetween =
                (dates[i] - dates[i - 1]) / (1000 * 60 * 60 * 24);
              totalDaysBetween += daysBetween;
              pairCount++;
            }
          }
        });

        const avgDaysBetweenOrders =
          pairCount > 0 ? Math.round(totalDaysBetween / pairCount) : 0;

        const html = `
          <div class="welcome">
            <h1>Customer Intelligence</h1>
            <p>Deep insights into your customer base and growth opportunities</p>
          </div>
          
          <div class="grid-4">
            <div class="card">

              <div class="stat-label">${recentCustomerIds.size} new this month</div>

              <h3>Repeat Rate</h3>
              <div class="stat-large">${c.repeatRate}%</div>
              <div class="stat-label">${c.repeatCustomers} repeat customers</div>
            </div>
            <div class="card">
              <h3>Avg Lifetime Value</h3>
              <div class="stat-large">$${c.avgLifetimeValue}</div>
              <div class="stat-label">Per customer</div>
            </div>
            <div class="card">
              <h3>Purchase Frequency</h3>
              <div class="stat-large">${avgDaysBetweenOrders}</div>
              <div class="stat-label">Days between orders</div>
            </div>
          </div>
          
          <div class="grid-4 mb-6">
            <div class="card" style="border-left:3px solid var(--warning)">
              <h3>VIP Customers</h3>
              <div class="stat-large text-warning">${vipCustomers.length}</div>
              <div class="stat-label">Spent ${avgLTV > 0 ? "2x" : ""} above average</div>
            </div>
            <div class="card" style="border-left:3px solid var(--info)">
              <h3>Regular Customers</h3>
              <div class="stat-large">${regularCustomers.length}</div>
              <div class="stat-label">Core customer base</div>
            </div>
            <div class="card" style="border-left:3px solid var(--success)">
              <h3>New Customers</h3>
              <div class="stat-large">${newCustomers.length}</div>

            <div class="card" style="border-left:3px solid var(--danger)">
              <h3>At-Risk Customers</h3>
              <div class="stat-large">${atRiskCount}</div>

          <div class="grid-2 mb-6">

          <div class="grid-2">
            <div class="card">
              <h3>🏆 VIP Customers (Top Spenders)</h3>

                    <thead><tr><th>Customer</th><th>Email</th><th>Orders</th><th>Total Spent</th><th>Status</th></tr></thead>

                      .slice(0, 10)

                        <td>${cu.name}</td>

            <div class="card">
              <h3>⚠️ At-Risk Customers</h3>
              <p style="color:var(--text-secondary);font-size:var(--fs-13);margin-bottom:var(--space-4)">Haven't ordered in 60+ days — time to re-engage!</p>
              ${
                atRiskCount === 0
                  ? `<p style="color:var(--text-muted);padding:var(--space-5);text-align:center">🎉 All customers are actively ordering!</p>`

                    <div class="action-item">
                      <div class="action-icon">📧</div>
                      <div class="action-content">
                        <div class="action-title">Send Win-Back Email</div>

                    <div class="action-item">
                      <div class="action-icon">🎁</div>
                      <div class="action-content">
                        <div class="action-title">Personalized Offers</div>
                        <div class="action-desc">Show them products similar to past purchases</div>

                    </div>
                    <div class="action-item">
                      <div class="action-icon">💬</div>
                      <div class="action-content">
                        <div class="action-title">Feedback Survey</div>
                        <div class="action-desc">Ask why they haven't returned</div>

        // Render charts
        setTimeout(() => renderCustomerCharts(c.topCustomers, orders), 100);
        return html;
      }

      // ============= CUSTOMER CHARTS =============
      function renderCustomerCharts(customers, orders) {
        if (!customers || customers.length === 0) return;

        // === CUSTOMER VALUE DISTRIBUTION (Pie Chart) ===
        const avgLTV =
          customers.reduce((s, c) => s + parseFloat(c.totalSpent), 0) /
          customers.length;
        const vip = customers.filter(
          (c) => parseFloat(c.totalSpent) > avgLTV * 2,
        ).length;
        const regular = customers.filter(
          (c) =>
            parseFloat(c.totalSpent) >= avgLTV &&
            parseFloat(c.totalSpent) <= avgLTV * 2,
        ).length;
        const occasional = customers.filter(
          (c) => parseFloat(c.totalSpent) < avgLTV,
        ).length;

        const valueCtx = document.getElementById("customerValueChart");
        if (valueCtx) {
          new Chart(valueCtx, {
            type: "doughnut",
            data: {
              labels: [
                "VIP Customers",
                "Regular Customers",
                "Occasional Buyers",
              ],
              datasets: [
                {
                  data: [vip, regular, occasional],
                  backgroundColor: ["#fbbf24", "#60a5fa", "#9ca7d6"],
                  borderColor: "#0f172a",
                  borderWidth: 2,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { color: "#9ca7d6", padding: 15, font: { size: 12 } },
                },
                tooltip: {
                  backgroundColor: "rgba(15, 23, 42, 0.95)",
                  titleColor: "#e5ecff",
                  bodyColor: "#9ca7d6",
                  borderColor: "rgba(148, 163, 184, 0.2)",
                  borderWidth: 1,
                  padding: 12,
                  callbacks: {
                    label: (ctx) => `${ctx.label}: ${ctx.parsed} customers`,
                  },
                },
              },
            },
          });
        }

        // === CUSTOMER GROWTH CHART (Last 30 days) ===
        const dailyCustomers = {};
        const today = new Date();

        for (let i = 29; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(d.getDate() - i);
          const key = d.toLocaleDateString("en-CA");
          dailyCustomers[key] = { new: 0, returning: 0 };
        }

        const seenCustomers = new Set();
        orders
          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
          .forEach((order) => {
            if (order.customer && order.customer.id) {
              const dateKey = new Date(order.created_at).toLocaleDateString(
                "en-CA",
              );
              const customerId = order.customer.id;

              if (dailyCustomers.hasOwnProperty(dateKey)) {
                if (seenCustomers.has(customerId)) {
                  dailyCustomers[dateKey].returning++;
                } else {
                  dailyCustomers[dateKey].new++;
                  seenCustomers.add(customerId);
                }
              }
            }
          });

        const growthLabels = Object.keys(dailyCustomers).map((d) => {
          const date = new Date(d + "T12:00:00");
          return date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          });
        });

        const newCustomerData = Object.values(dailyCustomers).map((d) => d.new);
        const returningCustomerData = Object.values(dailyCustomers).map(
          (d) => d.returning,
        );

        const growthCtx = document.getElementById("customerGrowthChart");
        if (growthCtx) {
          new Chart(growthCtx, {
            type: "bar",
            data: {
              labels: growthLabels,
              datasets: [
                {
                  label: "New Customers",
                  data: newCustomerData,
                  backgroundColor: "rgba(52, 211, 153, 0.8)",
                  borderColor: "#34d399",
                  borderWidth: 1,
                },
                {
                  label: "Returning Customers",
                  data: returningCustomerData,
                  backgroundColor: "rgba(96, 165, 250, 0.8)",
                  borderColor: "#60a5fa",
                  borderWidth: 1,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { color: "#9ca7d6", padding: 15, font: { size: 12 } },
                },
                tooltip: {
                  backgroundColor: "rgba(15, 23, 42, 0.95)",
                  titleColor: "#e5ecff",
                  bodyColor: "#9ca7d6",
                  borderColor: "rgba(148, 163, 184, 0.2)",
                  borderWidth: 1,
                  padding: 12,
                },
              },
              scales: {
                x: {
                  stacked: true,
                  grid: { display: false },
                  ticks: {
                    color: "#9ca7d6",
                    maxRotation: 45,
                    minRotation: 45,
                    font: { size: 10 },
                  },
                },
                y: {
                  stacked: true,
                  beginAtZero: true,
                  grid: { color: "rgba(148, 163, 184, 0.1)" },
                  ticks: { color: "#9ca7d6", precision: 0 },
                },
              },
            },
          });
        }
      }

      // ============= CONNECT SHOPIFY =============
      function renderConnectShopify() {
        return `
          <div class="card connect-cta">
            <h2>Connect Your Shopify Store</h2>
            <p>Aervo needs access to your Shopify data to provide AI-powered insights,<br>
            sales analytics, inventory tracking, and smart recommendations.</p>
            <button class="btn-primary" onclick="connectShopify()">🛍️ Connect Shopify Store</button>
          </div>
          <div class="card" style="margin-top:var(--space-6)">
            <h3 style="margin-bottom:var(--space-4);color:var(--text)">What You'll Get:</h3>
            <ul class="action-list">
              <li class="action-item"><div class="action-icon">🤖</div><div class="action-content"><div class="action-title">AI-Powered Insights</div><div class="action-desc">Smart recommendations to grow your business</div></div></li>
              <li class="action-item"><div class="action-icon">📊</div><div class="action-content"><div class="action-title">Real-Time Analytics</div><div class="action-desc">Track sales, revenue, and performance</div></div></li>
              <li class="action-item"><div class="action-icon">📦</div><div class="action-content"><div class="action-title">Inventory Management</div><div class="action-desc">Never run out of your best-sellers</div></div></li>
              <li class="action-item"><div class="action-icon">👥</div><div class="action-content"><div class="action-title">Customer Intelligence</div><div class="action-desc">Understand and grow your customer base</div></div></li>
            </ul>
          </div>`;
      }

      // ============= HELPER: ORDERS TABLE =============
      function renderOrdersTable(orders) {
        if (!orders || orders.length === 0)
          return `<p style="color:var(--text-muted);padding:var(--space-5);text-align:center">No orders yet</p>`;
        return `<div class="table-wrapper"><table class="data-table">
          <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
          <tbody>${orders
            .map(
              (o) => `
            <tr>
              <td>${o.name || o.order_number}</td>
              <td>${o.customer ? (o.customer.first_name || "") + " " + (o.customer.last_name || "").trim() || "Guest" : "Guest"}</td>
              <td>${new Date(o.created_at).toLocaleDateString()}</td>
              <td>${o.line_items ? o.line_items.length : 0}</td>
              <td>$${parseFloat(o.total_price || 0).toFixed(2)}</td>
              <td><span class="stat-change positive" style="margin:0">${o.financial_status}</span></td>
            </tr>`,
            )
            .join("")}
          </tbody>
        </table></div>`;
      }

      // ============= HELPER: ACTION ITEMS =============
      function renderActionItems(inv) {
        const items = [];
        if (inv && inv.outOfStock.length > 0)
          items.push({
            icon: "📦",
            title: `Restock ${inv.outOfStock.length} out-of-stock items`,
            desc: "Preventing potential lost revenue",
          });
        if (inv && inv.lowStock.length > 0)
          items.push({
            icon: "💰",
            title: `Review ${inv.lowStock.length} low-stock products`,
            desc: "Set reorder points to avoid stockouts",
          });
        if (items.length === 0)
          items.push({
            icon: "✅",
            title: "All caught up!",
            desc: "No urgent actions needed right now",
          });
        return `<ul class="action-list">${items
          .map(
            (a) => `
          <li class="action-item">
            <div class="action-icon">${a.icon}</div>
            <div class="action-content">
              <div class="action-title">${a.title}</div>
              <div class="action-desc">${a.desc}</div>
            </div>
          </li>`,
          )
          .join("")}</ul>`;
      }

      // ============= HELPER: AI INSIGHTS =============
      function generateInsights(d, inv) {
        const insights = [];
        if (inv && inv.outOfStock.length > 0) {
          insights.push({
            priority: "high",
            label: "HIGH PRIORITY",
            title: `${inv.outOfStock.length} product${inv.outOfStock.length > 1 ? "s are" : " is"} out of stock`,
            desc: `Restock to avoid lost sales. Top priority: ${inv.outOfStock[0]?.productTitle || "unknown"}`,
          });
        }
        if (d && parseFloat(d.revenue.change) > 10) {
          insights.push({
            priority: "medium",
            label: "OPPORTUNITY",
            title: `Revenue is up ${d.revenue.change}% this month`,
            desc: "Great momentum! Consider expanding your marketing to capitalize on this growth.",
          });
        }
        if (d && d.orders.today > d.orders.yesterday) {
          insights.push({
            priority: "low",
            label: "INSIGHT",
            title: "Orders are trending up today",
            desc: `${d.orders.today} orders so far vs ${d.orders.yesterday} yesterday.`,
          });
        }
        insights.push({
          priority: "low",
          label: "INSIGHT",
          title: "Monitor customer retention",
          desc: "Focus on repeat customers to increase lifetime value and sustainable growth.",
        });
        return insights.slice(0, 3);
      }

      // ============= CONNECT SHOPIFY FUNCTION =============

      async function connectShopify() {
        const shop = await uiPrompt(
          "Enter your Shopify store domain (e.g., your-store.myshopify.com):",
        );
        if (!shop) return;

        const normalized = shop.trim().toLowerCase();
        if (!normalized.includes(".myshopify.com")) {
          showToast("Please enter a valid Shopify domain ending in .myshopify.com");
          return;
        }

        try {
          const res = await fetch(`${BACKEND_URL}/auth/shopify/connect`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ shop: normalized }),
          });
          const data = await res.json();
          if (!res.ok || !data.url) throw new Error(data.message || "failed");
          window.location.href = data.url;
        } catch (err) {
          showToast(err.message || "Could not start the Shopify connection.", "error");
        }
      }

      // ============= CHAT =============
      let isAIThinking = false;
      const chatHistory = []; // last turns, so follow-up questions have context

      async function sendMessage() {
        if (isAIThinking) return;
        const input = document.getElementById("chatInput");
        const messages = document.getElementById("chatMessages");
        const message = input.value.trim();
        if (!message) return;

        const userMsg = document.createElement("div");
        userMsg.className = "chat-message user";
        userMsg.textContent = message;
        messages.appendChild(userMsg);
        input.value = "";
        messages.scrollTop = messages.scrollHeight;

        isAIThinking = true;
        const typingEl = document.createElement("div");
        typingEl.className = "chat-message ai";
        typingEl.id = "typingIndicator";
        typingEl.innerHTML =
          "<em style=\'color:#64748b\'>Aervo is thinking...</em>";
        messages.appendChild(typingEl);
        messages.scrollTop = messages.scrollHeight;
        input.disabled = true;
        document.querySelector(".btn-send").disabled = true;

        try {
          const response = await fetch(`${BACKEND_URL}/api/ai/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              message,
              history: chatHistory.slice(-6),
              shopOrigin: shopData ? shopData.shopOrigin : null,
            }),
          });
          const data = await response.json();
          document.getElementById("typingIndicator")?.remove();
          if (data.success) {
            const aiMsg = document.createElement("div");
            aiMsg.className = "chat-message ai";
            aiMsg.innerHTML = formatAiReply(data.reply);
            messages.appendChild(aiMsg);
            chatHistory.push({ role: "user", content: message });
            chatHistory.push({ role: "assistant", content: data.reply });
          } else {
            throw new Error(data.message || "Failed to get response");
          }
        } catch (err) {
          document.getElementById("typingIndicator")?.remove();
          const errMsg = document.createElement("div");
          errMsg.className = "chat-message ai";
          errMsg.textContent =
            "Sorry, I had trouble responding. Please try again.";
          messages.appendChild(errMsg);
        }

        isAIThinking = false;
        input.disabled = false;
        document.querySelector(".btn-send").disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }

      document.addEventListener("DOMContentLoaded", () => {
        const chatInput = document.getElementById("chatInput");
        if (chatInput)
          chatInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
          });
      });

      // ============= SUGGESTION HELPER =============
      function askSuggestion(el) {
        const input = document.getElementById("chatInput");
        if (input) {
          input.value = el.textContent;
          input.focus();
          sendMessage();
        }
      }

      // ============= BOOT =============
      loginReady.then(loadUserData);
      // ── HEALTH SCORE ───────────────────────────────────────────────
      async function loadHealthScore() {
        try {
          const res = await fetch(`${BACKEND_URL}/api/health-score`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          if (data.success && data.score) {
            renderHealthScore(data.score);
          } else {
            calculateHealthScore();
          }
        } catch (e) {
          console.error("Health score error:", e);
        }
      }

      async function calculateHealthScore() {
        const shopOrigin =
          shopData?.shopOrigin || localStorage.getItem("shopify_shop");
        if (!shopOrigin) return;
        try {
          const res = await fetch(`${BACKEND_URL}/api/health-score/calculate`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ shopOrigin }),
          });
          const data = await res.json();
          if (data.success) renderHealthScore(data.score, data.ai);
        } catch (e) {
          console.error("Calculate score error:", e);
        }
      }

      async function recalculateScore() {
        const btn = document.getElementById("recalcBtn");
        if (!btn) return;
        btn.textContent = "↻ Calculating...";
        btn.disabled = true;
        await calculateHealthScore();
        btn.textContent = "↻ Recalculate";
        btn.disabled = false;
      }

      function renderHealthScore(score, ai) {
        const s = score.score;
        const color = s >= 70 ? "#23e6a8" : s >= 40 ? "#fbbf24" : "#f87171";
        const grade =
          s >= 70
            ? "Healthy 💚"
            : s >= 40
              ? "Needs Attention ⚠️"
              : "At Risk 🔴";

        const ring = document.getElementById("scoreRing");
        const numEl = document.getElementById("scoreNumber");
        const gradeEl = document.getElementById("scoreGrade");
        const summaryEl = document.getElementById("scoreSummary");
        if (!ring || !numEl) return;

        const circumference = 264;
        const offset = circumference - (s / 100) * circumference;
        ring.style.stroke = color;
        setTimeout(() => {
          ring.style.strokeDashoffset = offset;
        }, 100);

        numEl.textContent = s;
        numEl.style.color = color;
        gradeEl.textContent = grade;
        gradeEl.style.color = color;
        summaryEl.textContent = score.summary || "";

        const breakdown = [
          { label: "Revenue", score: score.revenue_score, max: 25 },
          { label: "Orders", score: score.orders_score, max: 20 },
          { label: "Refunds", score: score.refund_score, max: 20 },
          { label: "Inventory", score: score.inventory_score, max: 20 },
          { label: "Retention", score: score.retention_score, max: 15 },
        ];

        const breakdownEl = document.getElementById("scoreBreakdown");
        if (breakdownEl) {
          breakdownEl.innerHTML = breakdown
            .map((b) => {
              const pct = (b.score / b.max) * 100;
              const c =
                pct >= 70 ? "#23e6a8" : pct >= 40 ? "#fbbf24" : "#f87171";
              return `
        <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2);">
          <div style="font-size:var(--fs-12);color:var(--text-muted);width:65px;">${b.label}</div>
          <div style="flex:1;height:5px;background:var(--surface-raised);border-radius:var(--radius-pill);overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:${c};border-radius:var(--radius-pill);transition:width 1s;"></div>
          </div>
          <div style="font-size:var(--fs-11);color:var(--text-secondary);width:30px;text-align:right;">${b.score}/${b.max}</div>
        </div>
      `;
            })
            .join("");
        }

        let improvements = [];
        try {
          const parsed =
            typeof score.improvements === "string"
              ? JSON.parse(score.improvements)
              : score.improvements;
          improvements = parsed.improvements || [];
        } catch (e) {}
        if (ai?.improvements) improvements = ai.improvements;

        const impEl = document.getElementById("scoreImprovements");
        if (impEl) {
          impEl.innerHTML = improvements
            .map(
              (imp) => `
      <div style="display:flex;align-items:flex-start;gap:var(--space-2);margin-bottom:var(--space-2);">
        <span style="color:var(--danger);font-size:var(--fs-12);margin-top:1px;">→</span>
        <span style="font-size:var(--fs-12);color:var(--text-secondary);line-height:var(--lh-normal);">${imp}</span>
      </div>
    `,
            )
            .join("");
        }
      }
    </script>
